<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Экосистема ИТК</title>
<style>
  :root{--navy:#112C93;--green:#128A04;--line:#d0d4dc;--muted:#6b7a99}
  html,body{margin:0;height:100%;background:#eef1f7;font-family:Arial,Helvetica,sans-serif;color:#1b1b1b}
  .g{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .box{background:#fff;max-width:420px;width:100%;border-radius:4px;border-top:4px solid var(--navy);padding:28px 24px;box-shadow:0 2px 12px rgba(17,44,147,.08);text-align:center}
  .ic{width:52px;height:52px;color:var(--navy);margin:0 auto 10px;display:block}
  h1{font-size:20px;color:var(--navy);margin:0 0 8px}
  p{font-size:15px;line-height:1.5;color:#444;margin:0 0 18px}
  a.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 22px;border-radius:4px}
  .spin{width:34px;height:34px;border:4px solid #dfe4f0;border-top-color:var(--navy);border-radius:50%;animation:s 0.9s linear infinite;margin:6px auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style></head>
<body><div class="g"><div class="box">
  <div id="wait"><div class="spin"></div><p>Проверяю доступ…</p></div>
  <div id="deny" hidden>
    <svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
    <h1>Только для сотрудников ИТК</h1>
    <p id="why">Чтобы открыть Экосистему, войдите в магазин itcpartner.store со своим рабочим входом, затем вернитесь сюда.</p>
    <a class="btn" href="/">Войти</a>
  </div>
</div></div>
<script>
/* Экосистема 4.10.9: сама программа приходит с сервера только после проверки пропуска сотрудника. */
(function(){
  /* Пропуск: из адреса (/eco/?t=… — так открывает приложение магазина), из этой вкладки или из входа в магазин */
  function tok(){
    var m = /[?&]t=([^&]+)/.exec(location.search || ''); if (m) { try{ return decodeURIComponent(m[1]); }catch(e){} }
    try{ var s = sessionStorage.getItem('eco_t'); if (s) return s; }catch(e){}
    try{ var a = JSON.parse(localStorage.getItem('itc_auth') || 'null'); return (a && a.token) || ''; }catch(e){ return ''; }
  }
  function deny(t){ document.getElementById('wait').hidden = true; document.getElementById('deny').hidden = false; if (t) document.getElementById('why').textContent = t; }
  var t = tok();
  if (!t) { deny(); return; }
  fetch('/api/eco_app.php?t=' + encodeURIComponent(t), { cache: 'no-store', credentials: 'same-origin' })
    .then(function(r){
      if (r.status === 401) { deny('Вход устарел. Войдите в магазин itcpartner.store заново, затем вернитесь сюда.'); return null; }
      if (r.status === 403) { deny('Этот вход не сотруднический. Экосистема открывается только сотрудникам ИТК.'); return null; }
      if (!r.ok) { deny('Не удалось открыть Экосистему. Обновите страницу.'); return null; }
      return r.text();
    })
    .then(function(html){
      if (!html) return;
      try{ sessionStorage.setItem('eco_t', t); }catch(e){}   // программа Экосистемы берёт пропуск отсюда
      var F = '<style id="itc-font">/* Шрифт Roboto — как на сайте itcpartner.ru (01.11.2026) */@font-face{font-family:\'Roboto\';font-style:normal;font-weight:300;font-display:swap;src:url(/fonts/roboto-cyrillic-300-normal.woff2) format(\'woff2\');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:300;font-display:swap;src:url(/fonts/roboto-latin-300-normal.woff2) format(\'woff2\');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/roboto-cyrillic-400-normal.woff2) format(\'woff2\');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/roboto-latin-400-normal.woff2) format(\'woff2\');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/roboto-cyrillic-500-normal.woff2) format(\'woff2\');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/roboto-latin-500-normal.woff2) format(\'woff2\');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/roboto-cyrillic-700-normal.woff2) format(\'woff2\');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:\'Roboto\';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/roboto-latin-700-normal.woff2) format(\'woff2\');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}html body,html body *:not(svg):not(path):not(code):not(pre):not(kbd):not(samp){font-family:\'Roboto\',Arial,sans-serif!important}</style>';
      html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, F + '</head>') : F + html;   /* шрифт Roboto, как на сайте */
      document.open('text/html', 'replace'); document.write(html); document.close();
    })
    .catch(function(){ deny('Нет связи с сервером. Проверьте интернет и обновите страницу.'); });
  if ('serviceWorker' in navigator) { try{ navigator.serviceWorker.register('/eco/sw.js', { scope: '/eco/' }); }catch(e){} }
})();
</script>
</body></html>
