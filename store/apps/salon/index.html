<!DOCTYPE html>
<!-- «Парикмахерские ИТК» v1 · №597 · 14.11.2026 · первое приложение на основе «ИТК Сервис» (api/svc.php).
     Клиент: рядом на карте со «светофором» (свободно сейчас / скоро / занято / закрыто), запись на время, мои записи.
     Салон: профиль и юрлицо, мастера, услуги с вариантами цены, часы, предоплата, расписание дня, «пришёл без записи», деньги (5% / 95%).
     Тот же файл годится для шиномонтажа и цветов: вид бизнеса — KIND (см. ниже), подписи — в LB. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112C93">
<title>Парикмахерские ИТК</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#112C93;--bg:#eef1f4;--card:#fff;--ink:#17202b;--muted:#5d6876;--line:#d5dbe2;--green:#16a34a;--yellow:#e0a100;--red:#d93025;--grey:#9aa3ad}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Roboto,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 10px;opacity:.85;font-size:14px}
#toShop{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:6px 12px 6px 8px;font:inherit;font-size:14px;font-weight:600;margin-bottom:8px;cursor:pointer}
nav{display:flex;gap:6px}
nav button{flex:1;border:0;border-radius:12px 12px 0 0;padding:10px 4px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
nav button.on{background:var(--bg);color:var(--navy)}
main{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.5}.b-navy{background:var(--navy);color:#fff}.b-line{background:#fff;color:var(--navy);border:2px solid var(--navy)}.b-green{background:var(--green);color:#fff}.b-red{background:#fff;color:var(--red);border:2px solid var(--red)}
.b-sm{padding:7px 11px;font-size:14px;border-radius:10px}.w100{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1 1 120px}
.muted{color:var(--muted)}.small{font-size:13.5px}.big{font-size:18px;font-weight:800}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.i{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea.i{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.load{padding:18px;text-align:center;color:var(--muted)}
#map{height:46vh;min-height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#dfe6ec}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.c-green{background:var(--green)}.c-yellow{background:var(--yellow)}.c-red{background:var(--red)}.c-grey{background:var(--grey)}
.t-green{color:var(--green)}.t-yellow{color:#a87700}.t-red{color:var(--red)}.t-grey{color:var(--muted)}
.biz{display:flex;gap:12px;cursor:pointer}.biz img,.biz .ph{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:#e3e8ee}
.biz h3{margin:0 0 2px;font-size:17px}.st{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;margin-top:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 10px}.legend span{display:flex;align-items:center;gap:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;text-align:center;font-weight:700;cursor:pointer}.slot.on{background:var(--green);border-color:var(--green);color:#fff}
.sv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.sv:first-child{border-top:0}
.pick{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer}.pick.on{border-color:var(--navy);background:#eef2ff}
.bk{border-left:4px solid var(--navy);padding:8px 10px;background:#f6f8fb;border-radius:10px;margin-top:6px}
.bk.s-come{border-color:var(--green)}.bk.s-done{border-color:var(--grey);opacity:.75}.bk.s-cancel,.bk.s-noshow{border-color:var(--red);opacity:.6}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;background:#e8edf5;color:var(--navy)}
.sheet{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h2{margin:4px 0 10px;font-size:20px}.x{float:right;border:0;background:#fff;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.photos{display:flex;gap:6px;overflow-x:auto}.photos img{height:120px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#17202b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}.hidden{display:none!important}
.hr{display:grid;grid-template-columns:44px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum div{background:#f6f8fb;border-radius:12px;padding:10px}.sum b{display:block;font-size:19px}
.err{color:var(--red);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<header><button id="toShop" type="button" class="hidden">← В кабинет</button>
<h1 id="hT">Парикмахерские</h1><p id="hS">Где свободно рядом — и запись без звонков</p>
<nav><button data-tab="near" class="on">Рядом</button><button data-tab="my">Мои записи</button><button data-tab="biz" id="tBiz">Мой салон</button><button data-tab="itc" id="tItc" class="hidden">ИТК</button></nav></header>
<main id="M"><div class="load">Загрузка…</div></main>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" async onload="window.LOK=1;if(window.TAB==='near'&&window.NEAR)mapNear(window.POS)" onerror="window.LFAIL=1;var m=document.getElementById('map');if(m)m.innerHTML='<div class=load>Карта не загрузилась — список ниже</div>'"></script>
<script>
"use strict";
/* ---------- вид бизнеса: тот же файл — шиномонтаж (tire) и цветы (flower) ---------- */
var KIND=(location.pathname.match(/\/apps\/(salon|tire|flower)\//)||[])[1]||'salon';
var LB={salon:{app:'Парикмахерские',sub:'Где свободно рядом — и запись без звонков',biz:'салон',Biz:'Салон',my:'Мой салон',st:'Мастер',sts:'Мастера',any:'Любой свободный мастер',svcEx:'Мужская стрижка',varEx:'Короткие / Длинные'},
        tire:{app:'Шиномонтаж',sub:'Где свободный пост рядом — без очереди',biz:'шиномонтаж',Biz:'Шиномонтаж',my:'Мой шиномонтаж',st:'Пост',sts:'Посты',any:'Любой свободный пост',svcEx:'Сезонная переобувка',varEx:'R13–R15 / R16–R18 / R19+'},
        flower:{app:'Цветы',sub:'Магазины рядом',biz:'магазин',Biz:'Магазин',my:'Мой магазин',st:'Флорист',sts:'Флористы',any:'Любой флорист',svcEx:'Букет',varEx:'Малый / Средний / Большой'}}[KIND];
document.title=LB.app+' ИТК';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var tT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},3200)}
function money(v,cur){v=+v||0;return (Math.round(v)===v?v.toLocaleString('ru-RU'):v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}))+(cur?' '+cur:'')}
var DOW=['','Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
/* ---------- вход: как у других приложений ИТК ---------- */
var TOK='',FROM_ITC=/[?&]from=itc/.test(location.search);
try{var mu=location.search.match(/[?&]u=([^&]+)/);if(mu){TOK=decodeURIComponent(mu[1]);localStorage.setItem('svc_u',TOK);}else TOK=localStorage.getItem('svc_u')||'';
 if(!TOK){var a0=JSON.parse(localStorage.getItem('itc_auth')||'null');if(a0&&a0.token)TOK=a0.token;}}catch(e){}
if(!TOK)location.replace('/?back='+encodeURIComponent(location.pathname));
var API='/api/svc.php';
function get(a,p){var q='?action='+a+'&t='+encodeURIComponent(TOK);for(var k in (p||{}))q+='&'+k+'='+encodeURIComponent(p[k]);return fetch(API+q,{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return{ok:false,error:'Нет связи'}})}
function post(a,b){b=b||{};b.t=TOK;return fetch(API+'?action='+a+'&t='+encodeURIComponent(TOK),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()}).catch(function(){return{ok:false,error:'Нет связи'}})}
$('hT').textContent=LB.app;$('hS').textContent=LB.sub;$('tBiz').textContent=LB.my;
$('toShop').classList.toggle('hidden',!FROM_ITC);$('toShop').onclick=function(){location.href='/'};
try{var au=JSON.parse(localStorage.getItem('itc_auth')||'null');if(au&&au.auth&&au.auth.role==='itc'&&au.auth.staffRole==='boss')$('tItc').classList.remove('hidden')}catch(e){}
var TAB='near';window.TAB=TAB;
document.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});TAB=window.TAB=b.dataset.tab;draw()};
function draw(){if(TAB==='near')drawNear();else if(TAB==='my')drawMy();else if(TAB==='biz')drawBiz();else drawItc()}
function sheet(html){closeSheet();var d=document.createElement('div');d.className='sheet';d.id='sh';d.innerHTML='<div><button class="x" onclick="closeSheet()">✕</button>'+html+'</div>';d.onclick=function(e){if(e.target===d)closeSheet()};document.body.appendChild(d);return d.firstChild}
function closeSheet(){var s=$('sh');if(s)s.remove()}

/* ======================= РЯДОМ ======================= */
var POS=null,MAP=null,MK=[],NEAR=window.NEAR=[];
function locate(cb){if(POS)return cb(POS);if(!navigator.geolocation)return cb(null);
 navigator.geolocation.getCurrentPosition(function(p){POS={lat:p.coords.latitude,lng:p.coords.longitude};cb(POS)},function(){cb(null)},{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
function drawNear(){var M=$('M');M.innerHTML='<div id="map"></div><div class="legend"><span><i class="dot c-green"></i>свободно сейчас</span><span><i class="dot c-yellow"></i>скоро</span><span><i class="dot c-red"></i>занято</span><span><i class="dot c-grey"></i>закрыто</span></div><div id="nl"><div class="load">Определяю, где вы…</div></div>';
 locate(function(p){if(!p)$('nl').innerHTML='<div class="card">Включите геолокацию, чтобы увидеть, где свободно рядом с вами.<div class="row" style="margin-top:10px"><button class="btn b-navy" onclick="POS=null;drawNear()">Включить и найти</button><button class="btn b-line" onclick="loadNear(null)">Показать все</button></div></div>';else loadNear(p)})}
function loadNear(p){$('nl').innerHTML='<div class="load">Ищу рядом…</div>';
 get('near',p?{kind:KIND,lat:p.lat,lng:p.lng,r:15}:{kind:KIND}).then(function(j){if(!j.ok){$('nl').innerHTML='<div class="card err">'+esc(j.error)+'</div>';return}NEAR=window.NEAR=j.list;window.POS=p;listNear();mapNear(p)})}
function listNear(){var h='';if(!NEAR.length)h='<div class="card">Рядом пока нет ни одного '+LB.biz+'а в приложении.<div class="small muted" style="margin-top:6px">Вы владелец? Откройте «'+LB.my+'» и добавьте себя — это бесплатно.</div></div>';
 NEAR.forEach(function(b){var L=b.load||{c:'grey',t:''};h+='<div class="card biz" onclick="openBiz('+b.id+')">'+(b.photos&&b.photos[0]?'<img src="'+esc(b.photos[0])+'" alt="">':'<div class="ph"></div>')
  +'<div style="flex:1;min-width:0"><h3>'+esc(b.name)+'</h3><div class="small muted">'+esc(b.address)+(b.km!=null?' · '+(b.km<1?Math.round(b.km*1000)+' м':b.km.toFixed(1).replace('.',',')+' км'):'')+'</div>'
  +'<div class="st t-'+L.c+'"><i class="dot c-'+L.c+'"></i>'+esc(L.t)+'</div>'+(b.from?'<div class="small muted">от '+money(b.from,b.cur)+'</div>':'')+'</div></div>'});
 $('nl').innerHTML=h}
function mapNear(p){if(!$('map'))return;if(window.LFAIL){$('map').style.height='auto';$('map').style.minHeight='0'}if(!window.L||!window.LOK){$('map').innerHTML='<div class="load">'+(window.LFAIL?'Карта не загрузилась — список ниже':'Карта загружается…')+'</div>';return}
 if(MAP){try{MAP.remove()}catch(e){}MAP=null}
 var c=p?[p.lat,p.lng]:(NEAR[0]&&NEAR[0].lat?[NEAR[0].lat,NEAR[0].lng]:[42.87,74.59]);
 MAP=L.map('map',{zoomControl:false}).setView(c,13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
 var col={green:'#16a34a',yellow:'#e0a100',red:'#d93025',grey:'#9aa3ad'};
 if(p)L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(MAP);
 var pts=[];NEAR.forEach(function(b){if(b.lat==null)return;var L0=b.load||{c:'grey'};
  var m=L.circleMarker([b.lat,b.lng],{radius:11,color:'#fff',weight:3,fillColor:col[L0.c],fillOpacity:1}).addTo(MAP);m.bindTooltip(esc(b.name)+' — '+esc(L0.t||''));m.on('click',function(){openBiz(b.id)});pts.push([b.lat,b.lng])});
 if(pts.length&&!p)MAP.fitBounds(pts,{padding:[30,30],maxZoom:15})}

/* ---------- карточка и запись ---------- */
var BZ=null,BK={};
function openBiz(id){var d=sheet('<div class="load">Загрузка…</div>');get('biz',{id:id}).then(function(j){if(!j.ok){d.innerHTML+='<div class="err">'+esc(j.error)+'</div>';return}BZ=j;BK={svc:null,v:'',staff:0,date:'',at:0};bizView()})}
function bizView(){var b=BZ.biz,L0=b.load||{c:'grey',t:''},h='<button class="x" onclick="closeSheet()">✕</button><h2>'+esc(b.name)+'</h2>';
 if(b.photos.length)h+='<div class="photos">'+b.photos.map(function(u){return'<img src="'+esc(u)+'" alt="">'}).join('')+'</div>';
 h+='<div class="st t-'+L0.c+'" style="margin:8px 0"><i class="dot c-'+L0.c+'"></i>'+esc(L0.t)+'</div><div class="small">'+esc(b.address)+(b.phone?' · <a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a>':'')+'</div>';
 if(b.lat!=null)h+='<div class="small" style="margin-top:4px"><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+b.lat+'&mlon='+b.lng+'#map=17/'+b.lat+'/'+b.lng+'">Открыть на карте</a></div>';
 if(b.about)h+='<p class="small muted">'+esc(b.about)+'</p>';
 var hs=[];for(var i=1;i<=7;i++){var x=b.hours[i];hs.push(DOW[i]+' '+(x?x.o+'–'+x.c:'выходной'))}h+='<details class="small muted"><summary>Часы работы</summary>'+hs.join('<br>')+'</details>';
 h+='<div class="card" style="margin-top:12px"><div class="big">1. Услуга</div>';
 BZ.services.forEach(function(s){var on=BK.svc===s.id;h+='<div class="pick'+(on?' on':'')+'" onclick="pickSvc('+s.id+')"><div class="row" style="justify-content:space-between"><b>'+esc(s.name)+'</b><span>'+(s.variants.length?'от '+money(Math.min.apply(null,s.variants.map(function(v){return v.price})),b.cur):money(s.price,b.cur))+'</span></div><div class="small muted">'+s.dur+' мин'+(s.note?' · '+esc(s.note):'')+'</div>';
  if(on&&s.variants.length)h+='<div class="chips" style="margin-top:8px">'+s.variants.map(function(v,k){return'<button class="chip'+(String(BK.v)===String(k)?' on':'')+'" onclick="event.stopPropagation();BK.v='+k+';BK.at=0;bizView()">'+esc(v.name)+' · '+money(v.price,b.cur)+'</button>'}).join('')+'</div>';h+='</div>'});
 h+='</div>';
 var s=svcById(BK.svc);
 if(s&&(!s.variants.length||BK.v!=='')){h+='<div class="card"><div class="big">2. '+LB.st+'</div><div class="chips" style="margin-top:8px"><button class="chip'+(!BK.staff?' on':'')+'" onclick="BK.staff=0;BK.at=0;bizView()">'+LB.any+'</button>'
  +BZ.staff.map(function(st){return'<button class="chip'+(BK.staff===st.id?' on':'')+'" onclick="BK.staff='+st.id+';BK.at=0;bizView()">'+esc(st.name)+'</button>'}).join('')+'</div></div>';
  h+='<div class="card"><div class="big">3. Время</div><div class="chips" style="margin-top:8px" id="days"></div><div id="sl"><div class="load">Смотрю свободное время…</div></div></div>';
  h+='<div id="conf"></div>'}
 $('sh').firstChild.innerHTML=h;if(s&&(!s.variants.length||BK.v!==''))daysAndSlots()}
function svcById(id){for(var i=0;i<(BZ?BZ.services.length:0);i++)if(BZ.services[i].id===id)return BZ.services[i];return null}
function pickSvc(id){BK.svc=id;BK.v='';BK.at=0;bizView()}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function daysAndSlots(){var t=new Date(),h='';if(!BK.date)BK.date=ymd(t);for(var i=0;i<7;i++){var d=new Date(t.getTime()+i*864e5),k=ymd(d);h+='<button class="chip'+(BK.date===k?' on':'')+'" onclick="BK.date=\''+k+'\';BK.at=0;bizView()">'+(i===0?'Сегодня':i===1?'Завтра':DOW[(d.getDay()||7)]+' '+d.getDate())+'</button>'}$('days').innerHTML=h;
 get('slots',{biz:BZ.biz.id,service:BK.svc,staff:BK.staff,date:BK.date}).then(function(j){if(!j.ok){$('sl').innerHTML='<div class="err">'+esc(j.error)+'</div>';return}
  if(!j.slots.length){$('sl').innerHTML='<div class="muted" style="margin-top:8px">На этот день свободного времени нет — выберите другой день'+(BK.staff?' или любого мастера':'')+'.</div>';return}
  $('sl').innerHTML='<div class="slots">'+j.slots.map(function(x){return'<div class="slot'+(BK.at===x.at?' on':'')+'" onclick="BK.at='+x.at+';BK.hm=\''+x.hm+'\';confView()">'+x.hm+'</div>'}).join('')+'</div>';if(BK.at)confView()})}
function confView(){document.querySelectorAll('.slot').forEach(function(e){e.classList.toggle('on',e.textContent===BK.hm)});var s=svcById(BK.svc),b=BZ.biz,price=s.variants.length?s.variants[BK.v].price:s.price,pp=b.prepay,pre=0;

 if(b.id)h+='<div class="card"><div class="big">Фото</div><div class="photos" style="margin:8px 0">'+(b.photos||[]).map(function(u){return'<div style="position:relative"><img src="'+esc(u)+'"><button class="x" style="position:absolute;top:4px;right:4px;width:28px;height:28px;font-size:14px" onclick="phDel(\''+esc(u)+'\')">✕</button></div>'}).join('')+'</div><input type="file" accept="image/*" id="pfile" class="hidden"><button class="btn b-line w100" onclick="$(\'pfile\').click()">+ Добавить фото</button></div>';
 h+='<button class="btn b-navy w100" id="pgo">Сохранить</button><div id="perr2"></div>';
 $('BB').innerHTML=h;$('ppm').value=pp.mode;var LT=b.legal_type||'';
 $('plt').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;LT=c.dataset.v;this.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===c)})};
 var LAT=b.lat,LNG=b.lng,mk=null;function setPt(a,g){LAT=a;LNG=g;$('pll').textContent='Точка стоит: '+a.toFixed(5)+', '+g.toFixed(5);if(PMAP){if(mk)mk.setLatLng([a,g]);else mk=L.marker([a,g]).addTo(PMAP);PMAP.setView([a,g],Math.max(PMAP.getZoom(),16))}}
 if(!(window.L&&window.LOK))$('pmap').innerHTML='<div class="load">Карта не загрузилась — нажмите «Я сейчас здесь», стоя у входа</div>';
 if(window.L&&window.LOK){if(PMAP){try{PMAP.remove()}catch(e){}}PMAP=L.map('pmap').setView(LAT!=null?[LAT,LNG]:(POS?[POS.lat,POS.lng]:[42.87,74.59]),LAT!=null?17:12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(PMAP);if(LAT!=null)mk=L.marker([LAT,LNG]).addTo(PMAP);PMAP.on('click',function(e){setPt(e.latlng.lat,e.latlng.lng)})}
 $('phere').onclick=function(){POS=null;locate(function(p){if(p)setPt(p.lat,p.lng);else toast('Не удалось определить — нажмите на карту')})};
 if($('pfile'))$('pfile').onchange=function(){var f=this.files[0];if(!f)return;shrink(f,function(d){post('photo',{biz:b.id,data:d}).then(function(j){if(!j.ok)toast(j.error);else{toast('Фото добавлено');drawBiz()}})})};
 $('pgo').onclick=function(){$('pgo').disabled=true;post('biz_save',{id:b.id||0,kind:KIND,name:$('pn').value,phone:$('pph').value,about:$('pab').value,legal_type:LT,legal_name:$('pln').value,inn:$('pinn').value,address:$('pad').value,city:$('pci').value,cur:$('pcu').value,lat:LAT,lng:LNG,tz:tz,
  hours:hoursRead('h'),prepay:{mode:$('ppm').value,value:+$('ppv').value||0,cancel_h:+$('ppc').value||0},admins:$('padm').value.split(/[,;\s]+/).filter(Boolean)}).then(function(j){$('pgo').disabled=false;if(!j.ok){$('perr2').innerHTML='<div class="err">'+esc(j.error)+'</div>';return}
  toast('Сохранено');var isNew=!b.id;CB={id:j.id};BT=isNew?'st':'prof';drawBiz()})}}
function phDel(u){if(confirm('Убрать фото?'))post('photo',{biz:CB.id,del:u}).then(function(){drawBiz()})}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)}

/* --- деньги --- */
function bMoney(){$('BB').innerHTML='<div class="load">Загрузка…</div>';get('money',{biz:CB.id}).then(function(j){if(!j.ok){$('BB').innerHTML='<div class="err">'+esc(j.error)+'</div>';return}var s=j.sum,c=j.cur;
 var h='<div class="card"><div class="small muted">Здесь — только деньги, которые клиенты заплатили через приложение. С них '+j.fee_pct+'% остаётся ИТК, '+(100-j.fee_pct)+'% — вам. Оплату на месте приложение не трогает.</div>'
  +'<div class="sum" style="margin-top:10px"><div>Прошло через приложение<b>'+money(s.paid,c)+'</b></div><div>Комиссия ИТК '+j.fee_pct+'%<b>'+money(s.fee,c)+'</b></div><div>Ждёт перевода вам<b>'+money(s.due,c)+'</b></div><div>Уже переведено<b>'+money(s.sent,c)+'</b></div></div></div>';
 if(!j.list.length)h+='<div class="card muted">Пока онлайн-оплат не было.</div>';
 j.list.forEach(function(p){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(p.what||'')+'</b><span>'+money(p.amount,c)+'</span></div><div class="small muted">'+esc(p.client||'')+' · '+(p.status==='refund'?'возвращено клиенту':'вам '+money(p.payout,c)+' · ИТК '+money(p.fee,c)+' · '+(p.payout_status==='sent'?'переведено':'ждёт перевода'))+'</div></div>'});
 $('BB').innerHTML=h})}

/* ======================= ИТК (руководитель) ======================= */
function drawItc(){$('M').innerHTML='<div class="load">Загрузка…</div>';get('admin').then(function(j){if(!j.ok){$('M').innerHTML='<div class="card err">'+esc(j.error)+'</div>';return}var t=j.total;
 var h='<div class="card"><div class="big">Все бизнесы «ИТК Сервис»</div><div class="sum" style="margin-top:10px"><div>Прошло через нас<b>'+money(t.through)+'</b></div><div>Наши '+j.fee_pct+'%<b>'+money(t.fee)+'</b></div><div>Перевести бизнесам<b>'+money(t.due)+'</b></div><div>Бизнесов<b>'+j.list.length+'</b></div></div></div>';
 var KN={salon:'парикмахерская',tire:'шиномонтаж',flower:'цветы'},LTn={ip:'ИП',ooo:'ООО',self:'самозанятый',other:'другое'};
 j.list.forEach(function(b){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(b.name)+'</b><span class="badge">'+(b.status==='active'?'виден клиентам':b.status==='draft'?'черновик':'выключен')+'</span></div><div class="small muted">'+esc(KN[b.kind]||b.kind)+' · '+esc(b.city||'')+' · '+esc(LTn[b.legal_type]||'форма не указана')+(b.inn?' · ИНН '+esc(b.inn):'')+' · записей за 30 дней: '+b.bk30+'</div>'
  +'<div class="small" style="margin-top:4px">Наши: '+money(b.fee)+' · ждёт перевода: '+money(b.due)+'</div>'+(+b.due>0?'<button class="btn b-line b-sm" style="margin-top:6px" onclick="if(confirm(\'Отметить, что '+money(b.due)+' переведено?\'))post(\'payout_mark\',{biz:'+b.id+'}).then(drawItc)">Отметить: переведено</button>':'')+'</div>'});
 $('M').innerHTML=h})}

if(TOK)draw();
</script>
</body>
</html>
