 if(!TOK){var a=JSON.parse(localStorage.getItem('itc_auth')||'null');if(a&&a.token)TOK=a.token;}}catch(e){}

 if($('qAll'))$('qAll').onchange=function(){Q.all=this.checked?1:0;};

}
