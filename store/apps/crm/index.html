      var kps = []; var sayT = String(r.say || '').replace(/\n?\[\[kp:([a-z0-9]+)\|([^\]]*)\]\]/g, function(_, id, ti){ kps.push([id, ti]); return ''; });

  /* ---------- перетаскивание: мышь — сразу, палец — после долгого нажатия ---------- */
  var DG = null;

  function dragInit(){
    [].forEach.call($('flBoard').querySelectorAll('.fl-card'), function(c){

  function down(e){

    if (DG.touch) DG.timer = setTimeout(function(){ if (DG && !DG.cancel) start(e.clientX, e.clientY); }, 380);

    DG.place = document.createElement('div'); DG.place.className = 'fl-place'; DG.place.style.height = r.height + 'px';
    c.parentNode.insertBefore(DG.place, c); c.classList.add('drag'); c.style.display = 'none';

    pos(x, y);
  }
  function pos(x, y){ DG.ghost.style.left = (x - DG.dx) + 'px'; DG.ghost.style.top = (y - DG.dy) + 'px'; }
  function move(e){
    if (!DG) return;
    if (!DG.on) {
      var far = Math.abs(e.clientX - DG.x) + Math.abs(e.clientY - DG.y) > 8;
      if (DG.touch) { if (far) { DG.cancel = true; clearTimeout(DG.timer); cleanup(); } return; }   // палец двинулся раньше — это прокрутка

    }

    var el = document.elementFromPoint(e.clientX, e.clientY), list = el && el.closest ? el.closest('.fl-list') : null;
    if (!list) { var col = el && el.closest ? el.closest('.fl-col') : null; if (col) list = col.querySelector('.fl-list'); }
    [].forEach.call(document.querySelectorAll('.fl-list.over'), function(l){ if (l !== list) l.classList.remove('over'); });
    if (list) {
      list.classList.add('over');
      var cards = [].filter.call(list.querySelectorAll('.fl-card'), function(c){ return c !== DG.card; }), bef = null;
      for (var i=0;i<cards.length;i++){ var r = cards[i].getBoundingClientRect(); if (e.clientY < r.top + r.height/2) { bef = cards[i]; break; } }
      if (bef) list.insertBefore(DG.place, bef); else list.appendChild(DG.place);

    var b = $('flBoard'), br = b.getBoundingClientRect();

    if (DG.on) {
      var list = DG.place.parentNode, stage = list.getAttribute('data-stage'), nxt = DG.place.nextElementSibling;
      while (nxt && !nxt.classList.contains('fl-card')) nxt = nxt.nextElementSibling;

  window.flAiMore = function(refresh, onlyCached){

        + (r.say ? '<div class="fl-say"><div class="fl-say-h"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>Как сказать клиенту'
            + '<button class="fl-say-c" onclick="flSayCopy()">Скопировать</button></div><div class="fl-say-t" id="flSayT">'+esc(r.say)+'</div></div>' : '')

      + '<div class="fl-f"><label>Стадии для начала</label><select id="flPk"><option value="sales">Как в продажах</option><option value="purchase">Как в закупке</option><option value="other">Простые: новые — в работе — готово</option></select></div>'
      + '<div style="display:flex;gap:8px;margin-top:12px"><button class="fl-btn" onclick="flPipeSave()">Создать</button><button class="fl-btn sec" onclick="flModalClose()">Отмена</button></div>'
      + (p ? '<div style="margin-top:18px;border-top:1px solid #eef2f4;padding-top:12px"><h3>Текущая воронка «'+esc(p.name)+'»</h3>'

  window.flPipeDel = function(){

  var ED = [];

            + '<select title="Что делает стадия" onchange="flEdSet('+i+',\'act\',this.value)"><option value="">—</option><option value="to_buy"'+(s.act==='to_buy'?' selected':'')+'>передать в закупку</option><option value="back_in"'+(s.act==='back_in'?' selected':'')+'>сюда — цена готова</option><option value="price_ok"'+(s.act==='price_ok'?' selected':'')+'>цена готова — в продажи</option></select>'
            + '<button class="fl-mini" onclick="flEdMv('+i+',-1)">↑</button><button class="fl-mini" onclick="flEdMv('+i+',1)">↓</button><button class="fl-mini" onclick="flEdDel('+i+')">×</button>'+(s.id ? '<button class="fl-mini" title="Роботы стадии" onclick="rbOpen('+i+')">'+RB_IC+(rbCount(s.id)||'')+'</button>' : '')+'</div>'
            + '<div class="fl-pal" id="flPal'+i+'" style="display:none">'+F.colors.map(function(c){ return '<span style="background:'+c+'" onclick="flEdSet('+i+',\'color\',\''+c+'\',1)"></span>'; }).join('')+'</div>';
        }).join('')
      + '</div><button class="fl-btn sec" onclick="flEdAdd()" style="margin-top:4px">+ Стадия</button>'
      + '<div style="display:flex;gap:8px;margin-top:14px"><button class="fl-btn" onclick="flEdSave()">Сохранить</button><button class="fl-btn sec" onclick="flModalClose()">Отмена</button></div>';
  }
  /* №239 · роботы стадий: сделка попала в стадию — робот сам ставит задачу, шаг, уведомление… */
  var RB_IC = '<svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;vertical-align:-2px"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66l.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/></svg>';
  function rbCount(sid){ return ((F.rb && F.rb.items) || []).filter(function(r){ return r.stage_id === sid; }).length; }
  function rbLoad(){ api('fl_robots', {pipe_id:F.pipe}).then(function(r){ if (r && r.ok) { F.rb = r; if (window._rbStage) rbRender(); else edRender(); } }); }

          + '<button class="fl-mini" title="' + (r.active == 1 ? 'Выключить' : 'Включить') + '" onclick="rbToggle(\'' + r.id + '\')">' + (r.active == 1 ? 'вкл' : 'выкл') + '</button><button class="fl-mini" title="Удалить" onclick="rbDel(\'' + r.id + '\')">×</button></div>'; }).join('')
        : '<div style="font-size:.88rem;color:#80868e;padding:6px 0">Роботов пока нет.</div>')
      + '<div style="margin-top:12px;padding:12px;background:#f5f7f9;border-radius:8px"><b style="font-size:.9rem">Добавить робота</b>'
      + '<label style="display:block;font-size:.78rem;color:#80868e;margin-top:8px">Что сделать</label><select id="rbK" style="' + st + '" onchange="window._rbKind=this.value;rbRender()">'
      + Object.keys((F.rb && F.rb.kinds) || {}).map(function(x){ return '<option value="' + x + '"' + (x === k ? ' selected' : '') + '>' + esc(F.rb.kinds[x]) + '</option>'; }).join('') + '</select>'

      + (k !== 'resp' ? '<label style="display:block;font-size:.78rem;color:#80868e;margin-top:8px">Текст</label><input id="rbT" style="' + st + '" placeholder="' + (k === 'notify' ? 'Сделка {сделка} ждёт решения' : 'Позвонить {клиент}: узнать, получили ли КП') + '">'
          + '<div style="font-size:.74rem;color:#80868e;margin-top:3px">Можно вставлять {клиент}, {сделка}, {сумма}, {ответственный}</div>' : '')
      + (k === 'task' || k === 'notify' || k === 'resp' ? '<label style="display:block;font-size:.78rem;color:#80868e;margin-top:8px">' + (k === 'resp' ? 'Кому передать сделку' : 'Кому') + '</label><select id="rbW" style="' + st + '">' + rbWhoOpts(k === 'resp' ? '' : 'resp', k) + '</select>' : '')
      + '<button class="fl-btn" style="margin-top:10px" onclick="rbAdd()">Добавить робота</button></div>'
      + '<div style="display:flex;gap:8px;margin-top:14px"><button class="fl-btn sec" onclick="rbBack()">&#8249; К стадиям</button></div>';
  }
  window.rbAdd = function(){
    var k = window._rbKind || 'task', d = $('rbD'), t = $('rbT'), w = $('rbW');
    api('fl_robot_save', {robot:{stage_id:window._rbStage.id, kind:k, days:d ? +d.value || 0 : 0, text:t ? t.value.trim() : '', who:w ? w.value : 'resp'}}).then(function(r){

  window.flPal = function(i){ var p = $('flPal'+i); p.style.display = p.style.display === 'none' ? 'flex' : 'none'; };

  window.flEdSave = function(){
    api('fl_stages_save', {pipe_id:F.pipe, stages:ED}).then(function(r){ if (!r || !r.ok) { msg((r&&r.error)||'Ошибка'); return; } flModalClose(); flLoad(); });
  };
})();

<script>
(function(){

  if (dark) document.documentElement.classList.add('crm-dark');
  document.documentElement.classList.add('cn-on');

    var on = document.documentElement.classList.toggle('crm-dark');
    try { localStorage.setItem('crm_theme', on ? 'dark' : 'light'); } catch(e){}
    document.getElementById('cnThT').textContent = on ? 'Светлая тема' : 'Тёмная тема с медузами';

  };
  /* ===== фоны: чтобы добавить новый, допишите строку в список (картинка: p — для телефона, l — для широкого экрана; видео: v + p как заставка) ===== */
  var BGS = [
    {id:'jelly',  n:'Медузы',     p:'/apps/crm/bg-p.jpg', l:'/apps/crm/bg-l.jpg', t:'/apps/crm/bg/jelly-t.jpg', dim:0},
    {id:'canyon', n:'Каньон',     p:'/apps/crm/bg/canyon-p.jpg', l:'/apps/crm/bg/canyon.jpg', t:'/apps/crm/bg/canyon-t.jpg', dim:.12},
    {id:'ice',    n:'Синий лёд',  p:'/apps/crm/bg/ice-p.jpg',    l:'/apps/crm/bg/ice.jpg',    t:'/apps/crm/bg/ice-t.jpg',    dim:.15}
  ];
  function bgGet(){ var id = 'ice'; try { id = localStorage.getItem('crm_bg') || 'ice'; } catch(e){} return BGS.filter(function(b){ return b.id === id; })[0] || BGS[0]; }
  function bgApply(b){

    r.setProperty('--bgp', 'url(' + b.p + ')'); r.setProperty('--bgl', 'url(' + (b.l || b.p) + ')'); r.setProperty('--bgdim', String(b.dim || 0));
    if (!box) return;
    var v = box.querySelector('video');
    if (b.v) { if (!v || v.getAttribute('src') !== b.v) { box.innerHTML = '<video autoplay muted loop playsinline preload="auto" poster="' + b.p + '" src="' + b.v + '"></video>'; } }
    else if (v) box.innerHTML = '';

  window.cnBgOpen = function(){

    document.getElementById('cnBgL').innerHTML = BGS.map(function(b){
      return '<button class="' + (b.id === cur.id ? 'on' : '') + '" onclick="cnBgSet(\'' + b.id + '\')"><img loading="lazy" src="' + (b.t || b.p) + '" alt="">' + (b.v ? '<i></i>' : '') + '<span>' + b.n + '</span></button>';
    }).join('');

  };

    if (v === 'm') {
      ['flBoard','flDay','flChat','flTime','flPay','flRep','flCli'].forEach(function(id){ var e = document.getElementById(id); if (e) e.style.display = 'none'; });

  window.cliCtSave = function(id){

  function histLoad(id){

        + (d.events.length ? d.events.slice(0, 80).map(function(e){
            var link = e.kind === 'deal' && e.id ? ' <a href="#" onclick="cnGo(\'b\');setTimeout(function(){flDeal(\''+esc(e.id)+'\')},300);return false">открыть</a>' : (e.file ? ' <a href="'+base+encodeURIComponent(e.file)+'&f=pdf" target="_blank">PDF</a>' : '');
            return '<div class="cl-ev '+esc(e.kind)+'"><b>'+esc(e.title)+'</b>'+(e.amount ? ' — '+esc((+e.amount).toLocaleString('ru-RU'))+' '+esc(e.cur === 'CNY' ? '¥' : (e.cur === 'USD' ? '$' : '₽')) : '')+link
              + (e.items && e.items.length ? '<div style="font-size:.8rem;color:#3d4a63;margin-top:3px">'+e.items.slice(0,8).map(function(x){ return '• '+esc(x); }).join('<br>')+'</div>' : '')
              + '<small>'+esc(dmy(e.at))+(e.sub ? ' · '+esc(e.sub) : '')+'</small></div>'; }).join('') : '<div class="cl-mut">Истории пока нет</div>');
    }).catch(function(){ var b = document.getElementById('clHist'); if (b) b.innerHTML = '<div class="cl-err">Нет связи с сервером</div>'; });

  /* ---------- дубли ---------- */
  window.cliDups = function(){
    CL.view = 'dups'; root().innerHTML = '<div class="cl-card cl-mut">Ищу дубли…</div>';
    aGet('crm_dups').then(function(d){
      if (!d || !d.ok) { root().innerHTML = '<div class="cl-card cl-err">'+esc((d&&d.error)||'Ошибка')+'</div>'; return; }
      CL.dups = d.groups;
      root().innerHTML = '<div class="cl-card"><div class="cl-bar"><button class="cl-b" onclick="cliList()">'+IC.back+'К списку</button></div><div class="cl-h">Похожие клиенты</div>'
        + (d.groups.length ? '<div class="cl-mut" style="margin-bottom:8px">Одно название без «ООО» и кавычек или один ИНН. Склеивает руководитель: контакты, КП, счета и история переедут в первого клиента.</div>'
          + d.groups.map(function(g, gi){ return '<div style="border:1px solid #eef1f6;border-radius:10px;padding:8px;margin-bottom:8px">' + g.map(function(c){ return '<div style="font-size:.88rem;padding:3px 0"><b>'+esc(nm(c))+'</b> <span class="cl-mut">'+esc([c.company && c.alias ? c.company : '', c.inn ? 'ИНН '+c.inn : '', 'заведён '+dmy(c.created_at)].filter(Boolean).join(' · '))+'</span></div>'; }).join('')
            + '<button class="cl-b g" style="margin-top:6px" onclick="cliMerge('+gi+')">Склеить в одного</button></div>'; }).join('') : '<div class="cl-mut">Дублей нет</div>') + '</div>';
    });
  };
  window.cliMerge = function(gi){
    var g = CL.dups[gi]; if (!g) return;
    aPost('crm_merge', {keep:g[0].id, drop:g.slice(1).map(function(c){ return c.id; })}).then(function(r){ if (!r || !r.ok) { toast((r&&r.error)||'Склеивает только руководитель'); return; } toast('Склеено'); cliDups(); });
  };

  /* ---------- перенос из Битрикс24 ---------- */
  window.cliImp = function(){
    CL.view = 'imp'; window.scrollTo(0,0);
    root().innerHTML = '<div class="cl-card"><div class="cl-bar"><button class="cl-b" onclick="cliList()">'+IC.back+'К списку</button></div><div class="cl-h">Перенос из Битрикс24</div>'
      + '<div style="font-size:.88rem;line-height:1.6">Как скачать файл из Битрикса:<br>1. Откройте Битрикс24 → CRM → <b>Компании</b> (потом так же <b>Контакты</b> и <b>Сделки</b>).<br>2. Справа вверху нажмите шестерёнку → <b>«Экспорт в CSV»</b> (или «Экспорт в Excel»).<br>3. Отметьте «Все поля», нажмите «Выполнить», затем «Скачать файл».<br>4. Выберите этот файл здесь. Порядок лучше такой: компании → контакты → сделки.</div>'
      + '<div class="cl-bar" style="margin-top:10px"><label class="cl-b g" style="margin:0">'+IC.up+'Выбрать файл из Битрикса<input type="file" accept=".csv,.xls,.xlsx,.html,text/csv" style="display:none" onchange="cliFile(this.files[0])"></label></div><div id="clImp"></div></div>';
  };
  function decode(buf){
    var u = new TextDecoder('utf-8').decode(buf);
    var bad = (u.match(/�/g) || []).length;
    if (bad > 3) { try { return new TextDecoder('windows-1251').decode(buf); } catch(e){} }
    return u.replace(/^﻿/, '');
  }
  function parseCsv(t){
    var first = t.split(/\r?\n/)[0] || '', d = [';', ',', '\t'].sort(function(a, b){ return first.split(b).length - first.split(a).length; })[0];
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
      if (c === '"') q = true; else if (c === d) { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ''; }); });
  }
  function parseHtml(t){
    var doc = new DOMParser().parseFromString(t, 'text/html'), out = [];
    [].forEach.call(doc.querySelectorAll('tr'), function(tr){ var r = [].map.call(tr.querySelectorAll('th,td'), function(c){ return c.textContent.trim(); }); if (r.some(function(x){ return x !== ''; })) out.push(r); });
    return out;
  }
  function col(h, re, not){ for (var i = 0; i < h.length; i++) { var x = h[i].toLowerCase(); if (re.test(x) && !(not && not.test(x))) return i; } return -1; }
  function cols(h, re){ var o = []; h.forEach(function(x, i){ if (re.test(x.toLowerCase())) o.push(i); }); return o; }
  function mapRows(rows){
    var h = rows[0].map(function(x){ return String(x).trim(); }), body = rows.slice(1), kind;
    var hl = h.map(function(x){ return x.toLowerCase(); }).join('|');
    if (/название сделки|^сделка\||\|сделка\|/.test(hl) || (/стадия/.test(hl) && /сумма/.test(hl))) kind = 'deal';
    else if (/(^|\|)имя(\||$)|фамилия/.test(hl) && !/название компании/.test(hl)) kind = 'contact';
    else kind = 'company';
    var get = function(r, i){ return i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : ''; };
    var join = function(r, ix){ return ix.map(function(i){ return get(r, i); }).filter(Boolean).filter(function(v, i, a){ return a.indexOf(v) === i; }).join(', '); };
    var ph = cols(h, /телефон/), em = cols(h, /e-?mail|почта/), resp = col(h, /ответствен/), note = col(h, /коммент/);
    var out;
    if (kind === 'company') { var n = col(h, /название компании|^название$|^компания$/); if (n < 0) n = col(h, /назван/);
      out = body.map(function(r){ return {name:get(r,n), inn:get(r, col(h, /^инн$|инн/)), phone:join(r,ph), email:join(r,em), addr:get(r, col(h, /адрес/, /e-?mail/)), site:get(r, col(h, /сайт|web/)), note:get(r,note), resp:get(r,resp)}; }); }
    else if (kind === 'contact') { var fn = col(h, /^имя$/), ln = col(h, /фамилия/), mn = col(h, /отчество/), full = col(h, /^(фио|контакт|полное имя)$/);
      out = body.map(function(r){ var nmv = full >= 0 && get(r, full) ? get(r, full) : [get(r, ln), get(r, fn), get(r, mn)].filter(Boolean).join(' ');
        return {name:nmv, post:get(r, col(h, /должност/)), phone:join(r,ph), email:join(r,em), company:get(r, col(h, /компани/)), note:get(r,note)}; }); }
    else { out = body.map(function(r){ return {title:get(r, col(h, /название сделки|^название$|^сделка$/)), amount:get(r, col(h, /^сумма|сумма сделки/)), currency:get(r, col(h, /валюта/)), stage:get(r, col(h, /стадия/)),
        company:get(r, col(h, /компани/)), contact:get(r, col(h, /^контакт|контакт$/)), phone:join(r,ph), email:join(r,em), resp:get(r,resp), note:get(r,note), created:get(r, col(h, /дата создания|создан/))}; }); }
    out = out.filter(function(x){ return (x.name || x.title || '').trim() !== ''; });
    return {kind:kind, rows:out, head:h};
  }
  window.cliFile = function(f){
    var b = document.getElementById('clImp'); if (!f) return;
    if (/\.xlsx$/i.test(f.name)) { b.innerHTML = '<div class="cl-err" style="margin-top:8px">Этот файл — настоящий Excel. Скачайте из Битрикса «Экспорт в CSV» — его можно прочитать здесь.</div>'; return; }
    b.innerHTML = '<div class="cl-mut" style="margin-top:8px">Читаю файл…</div>';
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var t = decode(rd.result), rows = /<table/i.test(t.slice(0, 5000)) ? parseHtml(t) : parseCsv(t);
        if (rows.length < 2) { b.innerHTML = '<div class="cl-err" style="margin-top:8px">В файле нет строк</div>'; return; }
        var m = mapRows(rows); CL.imp = m;
        var KN = {company:'компании', contact:'контакты', deal:'сделки'};
        var keys = m.kind === 'company' ? [['name','Название'],['inn','ИНН'],['phone','Телефон'],['email','Почта'],['addr','Адрес']] : m.kind === 'contact' ? [['name','Имя'],['company','Компания'],['post','Должность'],['phone','Телефон'],['email','Почта']] : [['title','Сделка'],['company','Компания'],['amount','Сумма'],['stage','Стадия в Битриксе'],['resp','Ответственный']];
        b.innerHTML = '<div style="margin-top:10px;font-size:.9rem">В файле <b>'+KN[m.kind]+'</b>: '+m.rows.length+' шт. Первые строки:</div>'
          + '<div class="cl-tbl"><table><tr>'+keys.map(function(k){ return '<th>'+k[1]+'</th>'; }).join('')+'</tr>'+m.rows.slice(0, 6).map(function(r){ return '<tr>'+keys.map(function(k){ return '<td>'+esc(r[k[0]])+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>'
          + '<div class="cl-mut">'+(m.kind === 'deal' ? 'Сделки встанут в воронку «Продажи»: в стадию с тем же названием, иначе — выигранные в «Успех», проигранные в «Провал», остальные в первую стадию. Ответственный подберётся по имени. Повторы пропускаются.' : 'Если клиент уже есть (тот же ИНН или то же название) — карточка дополнится, дубль не появится.')+'</div>'
          + '<div class="cl-bar" style="margin-top:8px"><button class="cl-b g" id="clGo" onclick="cliImpGo()">Перенести '+m.rows.length+'</button></div><div id="clProg"></div>';
      } catch(e) { b.innerHTML = '<div class="cl-err" style="margin-top:8px">Файл не прочитался: '+esc(e.message)+'</div>'; }
    };
    rd.readAsArrayBuffer(f);
  };
  window.cliImpGo = function(){
    var m = CL.imp; if (!m) return;
    var g = document.getElementById('clGo'); g.disabled = true;
    var p = document.getElementById('clProg'), tot = {new:0, upd:0, skip:0, err:[]}, i = 0, N = 50;
    p.innerHTML = '<div class="cl-bar2"><i id="clPb"></i></div><div class="cl-mut" id="clPt"></div>';
    function next(){
      if (i >= m.rows.length) { p.innerHTML = '<div class="cl-ok" style="margin-top:8px"><b>Готово.</b> Новых: '+tot.new+', дополнено: '+tot.upd+', пропущено: '+tot.skip+'.</div>'+(tot.err.length ? '<div class="cl-err">Не перенеслось ('+tot.err.length+'): '+esc(tot.err.slice(0, 10).join('; '))+'</div>' : '')+'<div class="cl-bar" style="margin-top:8px"><button class="cl-b" onclick="cliImp()">Перенести ещё файл</button><button class="cl-b" onclick="cliList()">К клиентам</button></div>'; return; }
      fPost('crm_import', {kind:m.kind, rows:m.rows.slice(i, i + N)}).then(function(r){
        if (!r || !r.ok) { p.innerHTML += '<div class="cl-err">'+esc((r&&r.error)||'Ошибка')+'</div>'; g.disabled = false; return; }
        tot.new += r.new; tot.upd += r.upd; tot.skip += r.skip; tot.err = tot.err.concat(r.err || []);
        i += N; document.getElementById('clPb').style.width = Math.min(100, Math.round(i / m.rows.length * 100)) + '%'; document.getElementById('clPt').textContent = 'Перенесено ' + Math.min(i, m.rows.length) + ' из ' + m.rows.length;
        setTimeout(next, 300);
      }).catch(function(){ setTimeout(next, 3000); });
    }
    next();
  };

  /* «Назад»: карточка → список */
  var ob = window.flBackStep;
  window.flBackStep = function(){
    var c = document.getElementById('flCli');
    if (c && c.style.display !== 'none' && CL.view !== 'list') {
      var f = document.getElementById('clCtF'); if (f && f.innerHTML) { f.innerHTML = ''; return true; }
      cliList(); return true;
    }
    return ob ? ob() : false;
  };
})();

<script>
/* ===== №492 · Товары в магазин: прайсы поставщиков → карточки itcpartner.store, цена по формуле ===== */
(function(){
  var PR = {lists:[], def:null, cats:[], boss:false, cur:null, tab:'', q:''};
  var I = {

    shop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2h2V8h4v2h2V8h2v12z"/></svg>',
    calc:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5.97 4.06L14.09 6l1.41 1.41L16.91 6l1.06 1.06-1.41 1.41 1.41 1.41-1.06 1.06-1.41-1.4-1.41 1.41-1.06-1.06 1.41-1.41-1.41-1.42zM6.25 7.72h5v1.5h-5v-1.5zM11.5 16h-2v2H8v-2H6v-1.5h2v-2h1.5v2h2V16zm6.5 1.25h-5v-1.5h5v1.5zm0-2.5h-5v-1.5h5v1.5z"/></svg>'
  };
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(a, d){ d = d || {}; d.t = window.CRM_TOKEN; return fetch('/api/flow.php?action='+a+'&t='+encodeURIComponent(window.CRM_TOKEN), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d), cache:'no-store'}).then(function(r){ return r.json(); }); }
  function rub(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  function num(n){ n = +n || 0; return (Math.round(n*100)/100).toString().replace('.', ','); }
  function curS(c){ return {CNY:'¥', USD:'$', RUB:'₽'}[c] || c; }
  function dt(s){ if (!s) return ''; return s.substr(8,2)+'.'+s.substr(5,2)+'.'+s.substr(0,4); }
  function toast(t){ var m = document.createElement('div'); m.className = 'sp-msg'; m.textContent = t; document.body.appendChild(m); setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, 3200); }
  function sheet(){
    var sh = $('prSheet');
    if (!sh) { sh = document.createElement('div'); sh.id = 'prSheet'; sh.className = 'cn-sheet'; sh.onclick = function(e){ if (e.target === sh) prClose(); };
      sh.innerHTML = '<div class="cn-in" id="prIn"></div>'; document.body.appendChild(sh); }
    sh.style.display = 'flex'; return $('prIn');
  }
  function top(title, back){ return '<div class="pr-top">'+(back ? '<button class="pr-x" title="Назад" onclick="'+back+'">'+I.back+'</button>' : '')+'<div class="cn-h">'+esc(title)+'</div><button class="pr-x" title="Закрыть" onclick="prClose()">'+I.close+'</button></div>'; }
  window.prClose = function(){ var s = $('prSheet'); if (s) s.style.display = 'none'; PR.view = ''; };

  /* ---------- список прайсов ---------- */
  window.prOpen = function(){
    if (window.cnMenu) cnMenu(0);
    var el = sheet(); PR.view = 'home'; el.innerHTML = top('Товары в магазин') + '<div class="pr-hint">Загрузка…</div>';
    api('pr_lists').then(function(r){

      el.innerHTML = top('Товары в магазин')
        + '<div class="pr-hint">Загрузите прайс поставщика — Excel, PDF или фото. Система найдёт товары и цены, посчитает цену в магазине и выложит карточки. Пришёл новый прайс — загрузите его снова: цены пересчитаются, позиций, которых нет, магазин скроет.</div>'
        + '<div class="pr-box"><div class="pr-hint" style="margin:6px 0">Формула по умолчанию: <b style="color:#fff">'+esc(r.deftext)+'</b><br>Курс магазина: юань '+num(PR.rates.CNY)+' ₽, доллар '+num(PR.rates.USD)+' ₽</div>'
        + (PR.boss ? '<button class="pr-b" onclick="prFormula()">'+I.calc+'Изменить формулу</button>' : '') + '</div>'
        + '<button class="pr-b go" onclick="prEdit(\'\')">'+I.add+'Новый прайс</button>'
        + (r.lists.length ? r.lists.map(function(l){ return '<button class="pr-c" onclick="prList(\''+l.id+'\')"><b>'+esc(l.name)+'</b><span>'+esc((l.supplier ? l.supplier+' · ' : '')+'в магазине '+l.onshop+' из '+l.items+' · цены в '+(l.cur==='CNY'?'юанях':l.cur==='USD'?'долларах':'рублях'))+'</span><small>'+esc(l.last_at ? 'Обновлён '+dt(l.last_at)+(l.last_by ? ' · '+l.last_by : '') : 'Прайс ещё не загружали')+(l.own ? ' · своя формула' : '')+'</small></button>'; }).join('')
                          : '<div class="pr-hint" style="margin-top:12px">Прайсов пока нет. Нажмите «Новый прайс».</div>');
    }).catch(function(){ el.innerHTML = top('Товары в магазин') + '<div class="pr-err">Нет связи с сервером</div>'; });
  };

  /* ---------- поля формулы ---------- */
  function fFields(f, pre){
    f = f || PR.def; pre = pre || 'f';
    return '<div class="row"><div><label>Перевод денег, %</label><input id="'+pre+'pay" type="number" step="0.1" value="'+f.pay+'"></div><div><label>Наценка, %</label><input id="'+pre+'markup" type="number" step="0.1" value="'+f.markup+'"></div><div><label>НДС, %</label><input id="'+pre+'vat" type="number" step="0.1" value="'+f.vat+'"></div></div>'
      + '<label>Доставка считается</label><select id="'+pre+'ship_mode" onchange="prShipMode(\''+pre+'\')"><option value="pct"'+(f.ship_mode==='pct'?' selected':'')+'>Процентом от цены товара</option><option value="kg"'+(f.ship_mode==='kg'?' selected':'')+'>Рублей за килограмм (нужен вес в прайсе)</option><option value="m3"'+(f.ship_mode==='m3'?' selected':'')+'>Рублей за кубометр (нужен объём в прайсе)</option></select>'
      + '<div class="row"><div id="'+pre+'w_pct"><label>Доставка, % от цены</label><input id="'+pre+'ship_pct" type="number" step="0.1" value="'+f.ship_pct+'"></div><div id="'+pre+'w_kg"><label>₽ за кг</label><input id="'+pre+'ship_kg" type="number" step="1" value="'+f.ship_kg+'"></div><div id="'+pre+'w_m3"><label>₽ за м³</label><input id="'+pre+'ship_m3" type="number" step="1" value="'+f.ship_m3+'"></div></div>'
      + '<div class="pr-hint" style="margin:6px 2px 0">Если в прайсе нет веса или объёма — доставка считается процентом.</div>'
      + '<label>Округлять цену вверх до, ₽</label><input id="'+pre+'round" type="number" step="1" value="'+f.round+'">';
  }
  window.prShipMode = function(pre){ var m = $(pre+'ship_mode').value; ['kg','m3'].forEach(function(k){ $(pre+'w_'+k).style.display = m === k ? '' : 'none'; }); };
  function fRead(pre){ var o = {}; ['pay','markup','vat','ship_pct','ship_kg','ship_m3','round'].forEach(function(k){ o[k] = $(pre+k).value; }); o.ship_mode = $(pre+'ship_mode').value; return o; }

  window.prFormula = function(){
    var el = sheet(); PR.view = 'formula';
    el.innerHTML = top('Формула цены по умолчанию', 'prOpen()') + '<div class="pr-hint">Цена в магазине = цена поставщика × курс + перевод денег + доставка, затем наценка и НДС. Действует для всех прайсов без своей формулы; цены выложенных товаров пересчитаются сразу.</div>'
      + '<div class="pr-f">'+fFields(PR.def, 'f')+'</div><div style="margin-top:14px"><button class="pr-b go" onclick="prFormulaSave()">Сохранить и пересчитать</button></div><div id="prMsg"></div>';
    prShipMode('f');
  };
  window.prFormulaSave = function(){
    api('pr_formula_save', {formula:fRead('f')}).then(function(r){ if (!r || !r.ok) { $('prMsg').innerHTML = '<div class="pr-err">'+esc((r && r.error) || 'Ошибка')+'</div>'; return; } toast('Формула сохранена. Пересчитано цен: '+r.recalc); prOpen(); });
  };

  /* ---------- настройки прайса ---------- */
  window.prEdit = function(id){
    var l = id ? (PR.cur && PR.cur.id === id ? PR.cur : PR.lists.filter(function(x){ return x.id === id; })[0]) : null; l = l || {name:'', supplier:'', cur:'CNY', rate:0, cat:'', subcat:'', hide_zero:1, formula:''};
    var own = l.formula && l.formula !== '[]' && l.formula !== '{}', f = l.f || PR.def;
    var el = sheet(); PR.view = 'edit';
    el.innerHTML = top(id ? 'Настройки прайса' : 'Новый прайс', id ? 'prList(\''+id+'\')' : 'prOpen()') + '<div class="pr-f">'
      + '<label>Название прайса</label><input id="peName" value="'+esc(l.name)+'" placeholder="Например: SNADI — инверторы">'
      + '<label>Поставщик (завод)</label><input id="peSup" value="'+esc(l.supplier)+'" placeholder="Например: SNADI, Фошань">'
      + '<div class="row"><div><label>Валюта цен в прайсе</label><select id="peCur"><option value="CNY"'+(l.cur==='CNY'?' selected':'')+'>Юани</option><option value="USD"'+(l.cur==='USD'?' selected':'')+'>Доллары</option><option value="RUB"'+(l.cur==='RUB'?' selected':'')+'>Рубли</option></select></div>'
      + '<div><label>Свой курс, ₽ (пусто — курс магазина)</label><input id="peRate" type="number" step="0.01" value="'+(+l.rate > 0 ? l.rate : '')+'"></div></div>'
      + '<label>Раздел магазина</label><select id="peCat"><option value="">— выберите —</option>'+PR.cats.map(function(c){ return '<option'+(c===l.cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select>'
      + '<label>Подраздел (необязательно)</label><input id="peSub" value="'+esc(l.subcat)+'" placeholder="Например: Гибридные инверторы">'
      + '<div class="pr-chk"><input type="checkbox" id="peZero"'+(+l.hide_zero ? ' checked' : '')+'><span>Скрывать в магазине позиции с нулевым остатком</span></div>'
      + '<div class="pr-chk"><input type="checkbox" id="peOwn"'+(own ? ' checked' : '')+' onchange="document.getElementById(\'peF\').style.display=this.checked?\'\':\'none\'"><span>Своя формула цены для этого прайса</span></div>'
      + '<div id="peF" class="pr-box" style="'+(own?'':'display:none')+'">'+fFields(own ? f : PR.def, 'g')+'</div>'
      + '</div><div style="margin-top:14px"><button class="pr-b go" onclick="prSave(\''+(id||'')+'\')">Сохранить</button>'+(id && l.edit !== false ? '<button class="pr-b red" onclick="prDel(\''+id+'\')">Удалить прайс</button>' : '')+'</div><div id="prMsg"></div>';
    prShipMode('g');
  };
  window.prSave = function(id){
    var d = {id:id, name:$('peName').value, supplier:$('peSup').value, cur:$('peCur').value, rate:$('peRate').value || 0, cat:$('peCat').value, subcat:$('peSub').value, hide_zero:$('peZero').checked ? 1 : 0};
    d.formula = $('peOwn').checked ? fRead('g') : [];
    if (!d.cat) { $('prMsg').innerHTML = '<div class="pr-err">Выберите раздел магазина</div>'; return; }
    api('pr_list_save', d).then(function(r){ if (!r || !r.ok) { $('prMsg').innerHTML = '<div class="pr-err">'+esc((r && r.error) || 'Ошибка')+'</div>'; return; }
      if (r.recalc) toast('Цены пересчитаны: '+r.recalc); prList(r.id); });
  };
  window.prDel = function(id){
    if (!confirm('Удалить прайс? Его товары в магазине будут скрыты.')) return;
    api('pr_list_del', {id:id}).then(function(r){ if (!r || !r.ok) { toast((r && r.error) || 'Ошибка'); return; } toast('Прайс удалён, скрыто товаров: '+r.hidden); prOpen(); });
  };

  /* ---------- позиции прайса ---------- */
  var ST = {on:'В магазине', new:'Не выложен', off:'Скрыт вручную', zero:'Нет в наличии', gone:'Нет в прайсе'};
  window.prList = function(id, keep){
    var el = sheet(); PR.view = 'list'; if (!keep) { PR.tab = ''; PR.q = ''; }
    if (!keep) el.innerHTML = top('Прайс', 'prOpen()') + '<div class="pr-hint">Загрузка…</div>';
    api('pr_items', {id:id, st:PR.tab, q:PR.q}).then(function(r){
      if (!r || !r.ok) { el.innerHTML = top('Прайс', 'prOpen()') + '<div class="pr-err">'+esc((r && r.error) || 'Ошибка')+'</div>'; return; }
      var l = PR.cur = r.list, c = r.counts || {}, all = 0; for (var k in c) all += c[k];
      var tabs = [['', 'Все', all], ['on', 'В магазине', c.on||0], ['new', 'Не выложены', c.new||0], ['zero', 'Нет в наличии', c.zero||0], ['gone', 'Нет в прайсе', c.gone||0], ['off', 'Скрыты', c.off||0]].filter(function(t){ return t[0] === '' || t[2] > 0; });
      el.innerHTML = top(l.name, 'prOpen()')
        + '<div class="pr-hint">'+esc((l.supplier ? l.supplier+' · ' : '')+'раздел «'+(l.cat||'—')+(l.subcat ? ' › '+l.subcat : '')+'» · курс '+num(l.rate_now)+' ₽')+'<br>Формула: '+esc(l.ftext)+(l.last_at ? '<br>Последний прайс: '+esc(l.last_file)+' · '+dt(l.last_at) : '')+'</div>'
        + (l.edit ? '<label class="pr-b go" style="display:inline-flex;align-items:center;gap:6px;padding:9px 13px;margin:0 6px 6px 0;border-radius:10px;background:#bbed21;color:#10162e;font:500 .88rem Roboto,sans-serif;cursor:pointer">'+I.up+(all ? 'Загрузить новый прайс' : 'Загрузить прайс')+'<input type="file" accept=".xlsx,.csv,.pdf,.docx,image/*" style="display:none" onchange="prUpload(this)"></label>'
                  + '<button class="pr-b" onclick="prEdit(\''+l.id+'\')">'+I.set+'Настройки и формула</button>'
                  + ((c.new||0) ? '<button class="pr-b" onclick="prPubAll()">'+I.shop+'Выложить все новые ('+c.new+')</button>' : '') : '')
        + (all ? '<div class="pr-tabs">'+tabs.map(function(t){ return '<button class="'+(PR.tab===t[0]?'on':'')+'" onclick="prTab(\''+t[0]+'\')">'+t[1]+' '+t[2]+'</button>'; }).join('')+'</div>'
               + '<input class="pr-q" id="prQ" placeholder="Поиск: название или артикул" value="'+esc(PR.q)+'" onkeydown="if(event.key===\'Enter\'){PR_q(this.value)}">' : '')
        + '<div id="prRows">'+(r.items.length ? r.items.map(function(x){ return row(x, l); }).join('') : (all ? '<div class="pr-hint">Ничего не нашлось</div>' : '<div class="pr-hint" style="margin-top:12px">Загрузите файл прайса — Excel (.xlsx), CSV, PDF, Word или фото страниц. Картинки из Excel подтянутся к товарам сами.</div>'))+'</div>'
        + (r.items.length >= 500 ? '<div class="pr-hint">Показаны первые 500 — уточните поиском</div>' : '');
    }).catch(function(){ el.innerHTML = top('Прайс', 'prOpen()') + '<div class="pr-err">Нет связи с сервером</div>'; });
  };
  function row(x, l){
    var ch = +x.prev_rub > 0 && +x.prev_rub !== +x.price_rub ? (+x.price_rub > +x.prev_rub ? '<i class="up">было '+rub(x.prev_rub)+'</i>' : '<i class="dn">было '+rub(x.prev_rub)+'</i>') : '';
    var btn = !l.edit ? '' : (x.st === 'on' ? '<button onclick="prItem('+x.id+',0)">Скрыть</button>' : (x.st === 'new' || x.st === 'off' ? '<button onclick="prItem('+x.id+',1)">'+(x.st==='new'?'Выложить':'Показать')+'</button>' : ''));
    var ph = x.img ? '<div class="ph" style="background-image:url(\''+esc(x.img)+'\')" title="Сменить фото" onclick="prImg('+x.id+')"></div>' : '<div class="ph" title="Добавить фото" onclick="prImg('+x.id+')">'+I.img+'</div>';
    return '<div class="pr-it">'+ph+'<div class="w"><div class="n">'+esc(x.name)+'</div><div class="m">'+esc((x.sku ? x.sku+' · ' : '')+curS(l.cur)+' '+num(x.price)+(x.stock !== null && x.stock !== undefined ? ' · остаток '+x.stock : ''))+'</div><span class="pr-st '+x.st+'">'+(ST[x.st]||x.st)+'</span></div>'
      + '<div class="r"><b>'+rub(x.price_rub)+'</b>'+ch+(x.product_id && x.st === 'on' ? '<br><a href="/?p='+encodeURIComponent(x.product_id)+'" target="_blank" style="color:#8fdcff;font-size:.74rem">в магазине</a>' : '')+(btn ? '<br>'+btn : '')+'</div></div>';
  }
  window.prTab = function(t){ PR.tab = t; prList(PR.cur.id, 1); };
  window.PR_q = function(v){ PR.q = v.trim(); prList(PR.cur.id, 1); };
  window.prItem = function(id, on){
    api(on ? 'pr_item_on' : 'pr_item_off', {id:id}).then(function(r){ if (!r || !r.ok) { toast((r && r.error) || 'Ошибка'); return; } toast(on ? 'Товар в магазине' : 'Товар скрыт в магазине'); prList(PR.cur.id, 1); });
  };
  window.prPubAll = function(){
    if (!confirm('Выложить в магазин все невыложенные позиции этого прайса?')) return;
    toast('Выкладываю…'); api('pr_publish', {list:PR.cur.id, all:1}).then(function(r){ if (!r || !r.ok) { toast((r && r.error) || 'Ошибка'); return; } toast('Выложено в магазин: '+r.n); prList(PR.cur.id, 1); });
  };
  window.prImg = function(id){
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){ var f = inp.files && inp.files[0]; if (!f) return; toast('Загружаю фото…');
      var fd = new FormData(); fd.append('file', f); fd.append('t', window.CRM_TOKEN);
      fetch('/api/api.php?action=upload_media&t=' + encodeURIComponent(window.CRM_TOKEN), {method:'POST', body:fd}).then(function(r){ return r.json(); })
        .then(function(r){ if (!r || !r.url) { toast((r && r.error) || 'Фото не загрузилось'); return; }
          api('pr_item_img', {id:id, url:r.url}).then(function(x){ if (x && x.ok) { toast('Фото добавлено'); prList(PR.cur.id, 1); } else toast((x && x.error) || 'Ошибка'); }); })
        .catch(function(){ toast('Фото не загрузилось'); }); };
    inp.click();
  };

  /* ---------- загрузка прайса: чтение → разбор ИИ → что изменится → применить ---------- */
  function b64(buf){ var u8 = new Uint8Array(buf), s = '', CH = 0x8000; for (var i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
  function prog(t, p){ var el = $('prIn'); el.innerHTML = top('Загрузка прайса', 'prList(\''+PR.cur.id+'\')') + '<div class="pr-hint" id="prPt">'+esc(t)+'</div><div class="pr-bar"><i id="prPb" style="width:'+(p||5)+'%"></i></div><div id="prMsg"></div>'; PR.view = 'load'; }
  function pfail(t){ var m = $('prMsg'); if (m) m.innerHTML = '<div class="pr-err">'+esc(t)+'</div><button class="pr-b" onclick="prList(\''+PR.cur.id+'\')">Назад</button>'; }
  window.prUpload = function(inp){
    var f = inp.files && inp.files[0]; if (!f) return; var ext = (f.name.split('.').pop() || '').toLowerCase();
    if (ext === 'xls') { toast('Старый формат .xls — откройте в Excel и сохраните как .xlsx'); return; }
    if (f.size > 25*1048576) { toast('Файл больше 25 МБ'); return; }
    prog('Читаю файл «'+f.name+'»…', 5);
    var start = function(d){ d.list = PR.cur.id; d.name = f.name; $('prPt').textContent = 'Ищу товары и цены…'; $('prPb').style.width = '15%';
      return api('pr_parse_start', d).then(function(r){ if (!r || !r.ok) throw new Error((r && r.error) || 'Не получилось разобрать файл'); PR.pid = r.pid; return step(r); }); };
    var p;
    if (ext === 'xlsx' || ext === 'csv') p = f.arrayBuffer().then(function(buf){ return start({data:b64(buf)}); });
    else if (window.FilFiles) p = FilFiles.read([f], api).then(function(out){ var a = out && out[0]; if (!a || a.err || !a.id) throw new Error((a && a.err) || 'Файл не прочитался'); return start({file_id:a.id}); });
    else p = Promise.reject(new Error('Чтение PDF недоступно — обновите страницу'));
    p.catch(function(e){ pfail(e.message || 'Ошибка'); });
  };
  function step(r){
    if (r.done >= r.n) return preview();
    $('prPt').textContent = 'Разбираю прайс: часть '+(r.done+1)+' из '+r.n+'. Найдено позиций: '+(r.count||0); $('prPb').style.width = Math.round(15 + 75 * r.done / r.n) + '%';
    return api('pr_parse_step', {pid:PR.pid}).then(function(x){ if (!x || !x.ok) throw new Error((x && x.error) || 'Сбой разбора'); return step(x); });
  }
  function preview(){
    $('prPt').textContent = 'Считаю цены…'; $('prPb').style.width = '95%';
    return api('pr_preview', {pid:PR.pid}).then(function(v){
      if (!v || !v.ok) throw new Error((v && v.error) || 'Ошибка');
      if (!v.total) throw new Error('В файле не нашлось товаров с ценой. Если это фото — снимите ровнее и ближе.');
      var el = $('prIn'); PR.view = 'preview';
      el.innerHTML = top('Что изменится', 'prList(\''+PR.cur.id+'\')')
        + '<div class="pr-hint">Файл «'+esc(v.file)+'» · формула: '+esc(v.formula)+'</div>'
        + (v.cur_file && v.cur_file !== v.cur ? '<div class="pr-warn">Похоже, цены в файле в валюте «'+esc(v.cur_file)+'», а в настройках прайса — «'+esc(v.cur)+'». Проверьте валюту в настройках прайса перед применением.</div>' : '')
        + '<div class="pr-sum"><div><b>'+v.total+'</b>позиций в файле</div><div><b class="nw">'+v.new+'</b>новых</div><div><b class="up">'+v.up+'</b>подорожали</div><div><b class="dn">'+v.down+'</b>подешевели</div><div><b>'+v.zero+'</b>нет в наличии — скрыть</div><div><b>'+v.gone+'</b>пропали из прайса — скрыть</div></div>'
        + '<div style="margin:6px 0 10px"><button class="pr-b go" id="prA1" onclick="prApply(1)">'+I.shop+'Применить и выложить всё</button><button class="pr-b" id="prA0" onclick="prApply(0)">Применить, новые пока не выкладывать</button><button class="pr-b" onclick="prList(\''+PR.cur.id+'\')">Отмена</button></div>'
        + '<div id="prMsg"></div>'
        + v.rows.map(function(x){ var ch = x.ch === 'new' ? '<i class="nw">новый</i>' : x.ch === 'up' ? '<i class="up">было '+rub(x.was)+'</i>' : x.ch === 'down' ? '<i class="dn">было '+rub(x.was)+'</i>' : '';
            return '<div class="pr-it">'+(x.img ? '<div class="ph" style="background-image:url(\''+esc(x.img)+'\')"></div>' : '<div class="ph">'+I.img+'</div>')+'<div class="w"><div class="n">'+esc(x.name)+'</div><div class="m">'+esc((x.sku ? x.sku+' · ' : '')+curS(v.cur)+' '+num(x.price)+(x.stock !== null ? ' · остаток '+x.stock : ''))+(x.zero ? ' · <span class="up">нет в наличии</span>' : '')+'</div></div><div class="r"><b>'+rub(x.rub)+'</b>'+ch+'</div></div>'; }).join('')
        + (v.total > v.rows.length ? '<div class="pr-hint">Показаны первые '+v.rows.length+' из '+v.total+'</div>' : '');
    });
  }
  window.prApply = function(pub){
    $('prA1').disabled = $('prA0').disabled = true; $('prMsg').innerHTML = '<div class="pr-hint">Записываю'+(pub ? ' и выкладываю в магазин' : '')+'… это может занять минуту</div>';
    api('pr_apply', {pid:PR.pid, publish:pub}).then(function(r){
      if (!r || !r.ok) { $('prMsg').innerHTML = '<div class="pr-err">'+esc((r && r.error) || 'Ошибка')+'</div>'; $('prA1').disabled = $('prA0').disabled = false; return; }
      toast('Готово: новых '+r.new+', обновлено '+r.upd+', в магазине '+r.shop+', скрыто '+r.hidden); prList(PR.cur.id);
    }).catch(function(){ $('prMsg').innerHTML = '<div class="pr-err">Нет связи с сервером — проверьте позиции и повторите</div>'; });
  };

  /* системная «Назад»: окна прайсов закрываются по шагам */
  var ob = window.flBackStep;
  window.flBackStep = function(){
    var s = $('prSheet');
    if (s && s.style.display !== 'none') {
      if (PR.view === 'list' || PR.view === 'formula' || (PR.view === 'edit' && !(PR.cur && PR.cur.id))) prOpen();
      else if ((PR.view === 'edit' || PR.view === 'load' || PR.view === 'preview') && PR.cur) prList(PR.cur.id);
      else prClose();
      return true;
    }
    return ob ? ob() : false;
  };
})();
</script>

</body></html>
