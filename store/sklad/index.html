var CAM = null;
function scanOpen(){
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { toast(L('camErr')); return; }
  var det; try { det = new BarcodeDetector({formats:['code_128','code_39','ean_13','qr_code','itf','codabar']}); } catch(e){ toast(L('camErr')); return; }
  var box = document.createElement('div'); box.className = 'cam';
  box.innerHTML = '<video playsinline muted autoplay></video><div class="hint"></div><div class="bar"><button class="btn w" style="flex:1" id="camX">' + L('back') + '</button></div>';
  document.body.appendChild(box);
  var v = box.querySelector('video'), stop = function(){ try { CAM && CAM.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} CAM = null; box.remove(); };
  box.querySelector('#camX').onclick = stop;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
    CAM = st; v.srcObject = st;
    (function loop(){ if (!CAM) return; det.detect(v).then(function(c){ if (c && c.length) { var code = c[0].rawValue; stop(); if ($('code')) $('code').value = code; findCode(code); return; } setTimeout(loop, 250); }).catch(function(){ setTimeout(loop, 400); }); })();
  }).catch(function(){ stop(); toast(L('camErr')); });
}

    var msg = '你好！请用手机相机扫描二维码，或打开链接下载「ITC 仓库」App：\n' + r.url + '\n安装后打开App，输入登录码：' + r.code + '\n（登录码有效期至 ' + r.till + '）';
    $('invIn').innerHTML = '<b style="font-size:1.05rem">Приложение для кладовщика</b><div class="mut" style="margin-top:4px">Кладовщик наводит камеру телефона на QR-код — откроется страница скачивания на китайском.</div>'
      + '<div class="qr" id="invQr"></div><div>Код входа</div><div class="code">' + esc(r.code) + '</div><div class="mut">действует до ' + esc(r.till) + '</div>'
      + '<div style="margin:12px 0 4px;text-align:left" class="mut">Или перешлите в WeChat готовый текст:</div><textarea id="invTx" readonly>' + esc(msg) + '</textarea>'
      + '<div class="row"><button class="btn" style="flex:1" onclick="invCopy()">Скопировать текст</button><button class="btn w" style="flex:1" onclick="invOpen(1)">Новый код</button></div>'
      + '<div class="row"><button class="btn w" style="flex:1" onclick="$(\'inv\').style.display=\'none\'">Закрыть</button></div>';
    try { new QRCode($('invQr'), {text:r.url, width:220, height:220, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}); } catch(e){}
  });
}
function invCopy(){ var t = $('invTx'); t.select(); try { navigator.clipboard.writeText(t.value).then(function(){ toast('Скопировано'); }, function(){ document.execCommand('copy'); toast('Скопировано'); }); } catch(e){ document.execCommand('copy'); toast('Скопировано'); } }

/* ---------- рабочее время (общий учёт с офисом, /api/flow.php) ---------- */
var WT = null, WIC = {play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>', pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>', stop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>'};
function wtApi(a, d){ d = d || {}; d.t = TOK; return fetch('/api/flow.php?action=' + a + '&t=' + encodeURIComponent(TOK), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)}).then(function(r){ return r.json(); }); }
function wtHm(m){ m = +m || 0; return S.lang === 'zh' ? Math.floor(m/60) + '小时' + (m%60) + '分' : Math.floor(m/60) + ' ч ' + ('0' + m%60).slice(-2) + ' мин'; }
function wtPaint(){
  var b = $('wtb'); if (!b || !WT) return; b.style.display = 'flex'; var h = '';
  if (WT.status === 'off' && !WT.start) h = '<span>' + L('wtOff') + ' · ' + esc(WT.sched) + '</span><button class="go" onclick="wtMark(\'start\')">' + WIC.play + L('wtStart') + '</button>';
  else if (WT.status === 'off') h = '<span>' + L('wtDone') + ' ' + esc(WT.end) + ' · ' + L('wtWorked') + ' ' + wtHm(WT.worked) + '</span><button onclick="wtMark(\'start\')">' + WIC.play + L('wtBack') + '</button>';
  else h = '<span><b>' + (WT.status === 'break' ? L('wtBrk') : L('wtOn') + ' ' + esc(WT.start)) + '</b> · ' + wtHm(WT.worked) + '</span>'
    + (WT.status === 'break' ? '<button class="go" onclick="wtMark(\'start\')">' + WIC.play + L('wtBack') + '</button>' : '<button onclick="wtMark(\'break\')">' + WIC.pause + L('wtPause') + '</button>')
    + '<button class="end" onclick="wtMark(\'end\')">' + WIC.stop + L('wtEnd') + '</button>';
  b.innerHTML = h; b.className = 'wtb' + (WT.status === 'off' && !WT.start ? ' off' : '');
}
function wtLoad(){ wtApi('wt_state', {}).then(function(r){ if (r && r.ok) { WT = r.st; wtPaint(); } }).catch(function(){}); }
function wtMark(a){
  if (a === 'end' && !confirm(L('wtEndQ'))) return;
  wtApi('wt_mark', {act:a}).then(function(r){ if (!r || !r.ok) { toast((r && r.error) || L('retry')); return; } WT = r.st; wtPaint(); toast(L('done')); }).catch(function(){ toast(L('retry')); });
}

/* ---------- старт ---------- */
(function(){
  if (!S.lang) S.lang = 'zh';
  paint();
  if (!TOK) { showLogin(); return; }
  api('sk_me', {}).then(function(r){
    if (!r || !r.ok) {
      if (r && /Сесси|авториз/i.test(r.error || '')) { try { localStorage.removeItem('sk_tok'); sessionStorage.removeItem('sk_t'); } catch(e){} showLogin(); return; }
      $('gateT').textContent = (r && r.error) || L('noAccess'); return; }
    S.me = r.me;
    try { if (!localStorage.getItem('sk_lang')) S.lang = r.lang; } catch(e){ S.lang = r.lang; }
    if (!r.me.wh) { var ws = r.whs || []; $('whSel').innerHTML = ws.map(function(w){ return '<option value="' + esc(w.id) + '">' + esc(w.name) + '</option>'; }).join(''); $('whSel').style.display = ws.length ? '' : 'none';
      var cn = ws.filter(function(w){ return /кита|china|广|佛|义乌|guang|fosh/i.test((w.city || '') + (w.name || '')); })[0]; S.wh = (cn || ws[0] || {}).id || ''; $('whSel').value = S.wh; }
    $('gate').style.display = 'none'; $('tabs').style.display = 'flex';
    if (!r.me.wh) $('qrB').style.display = 'inline-flex';
    if (SOLO) $('bk').style.display = 'none';
    try { if (window.AndroidSklad && AndroidSklad.loggedIn) AndroidSklad.loggedIn(TOK); } catch(e){}   // приложение склада: пропуск для уведомлений
    var tq = /[?&]tab=(in|ex|cg|ch)/.exec(location.search || '');
    paint(); tab(tq ? tq[1] : 'in');   // склад рабочий день не отмечает — кладовщик работает, когда приезжает груз
    api('sk_expected', {}).then(function(x){ var n = $('lateN'); if (n && x && x.ok) n.textContent = x.late || ''; });
    api('sk_cargo_list', {lang:S.lang}).then(function(x){ var n = $('cgN'); if (n && x && x.ok) n.textContent = x.rows.filter(function(c){ return c.status === 'order'; }).length || ''; });
  }).catch(function(){ $('gateT').textContent = L('retry'); });
})();
</script>
