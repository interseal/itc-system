; ИТК · «Космос» · отдельный пул PHP
[kosmos]
user = www-data
group = www-data
listen = /run/php/kosmos.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 900
php_admin_value[output_buffering] = 0
php_admin_value[zlib.output_compression] = Off
php_admin_value[max_execution_time] = 900
; 0.5.0 (№624): тело запроса до 64 МБ — 10 снимков к Claude (до 26 МБ) и файлы до 8 МБ в запросе; большие файлы сервер забирает сам по ссылке
php_admin_value[memory_limit] = 512M
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[expose_php] = Off
php_admin_value[error_log] = /var/log/kosmos/php.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
