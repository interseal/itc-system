# ИТК · «Космос» · nginx. Сертификат https добавляет certbot (агент запускает его сам, когда DNS готов).
server {
    listen 80 default_server;
    server_name kosmos.itcpartner.store _;
    root /opt/kosmos/www;
    index index.html;
    client_max_body_size 64m;   # 0.5.0 (№624): было 2m — снимки к Claude и файлы не проходили
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://itcpartner.store https://www.itcpartner.store" always;

    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/kosmos.sock;
        fastcgi_buffering off;            # ответ Claude идёт на экран по мере написания
        fastcgi_read_timeout 900s;
        gzip off;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://itcpartner.store https://www.itcpartner.store" always;
    }
}
