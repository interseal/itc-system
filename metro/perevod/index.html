<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИТК Переводчик</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ИТК Переводчик">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="fav-64.png">
<style>
@font-face{font-family:'Roboto';font-weight:400;font-display:swap;src:url(../fonts/roboto-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Roboto';font-weight:400;font-display:swap;src:url(../fonts/roboto-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Roboto';font-weight:500;font-display:swap;src:url(../fonts/roboto-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Roboto';font-weight:500;font-display:swap;src:url(../fonts/roboto-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Roboto';font-weight:700;font-display:swap;src:url(../fonts/roboto-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Roboto';font-weight:700;font-display:swap;src:url(../fonts/roboto-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2212}
:root{
  --bg:#121214;--card:#232327;--card2:#2c2c31;--line:#38383e;--ink:#fff;--mute:#a0a0aa;
  --pink:#FF1493;--pinkd:#c2106f;--a:#163f33;--b:#26315a;--ok:#4DD637;--err:#ff6b6b;
  --nav:#1b1b1f;--hl:rgba(255,20,147,.18);
}
@media (prefers-color-scheme: light){
  :root{--bg:#f2f3f7;--card:#fff;--card2:#eceef3;--line:#dcdfe6;--ink:#141418;--mute:#6b6f7a;--a:#d9f0e2;--b:#dde4fa;--nav:#fff;--hl:rgba(255,20,147,.12)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:16px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.mi{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.hidden{display:none!important}

/* шапка */
#top{flex:none;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--bg)}
#top h1{flex:1;margin:0;text-align:center;font-size:20px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top h1 b{color:var(--pink)}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:active{background:var(--card2)}
#offline{flex:none;background:#5a1d24;color:#fff;text-align:center;padding:8px;font-size:14px;display:flex;gap:8px;justify-content:center;align-items:center}
#offline .mi{width:20px;height:20px}

/* тема разговора */
.topic{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:18px;background:var(--card2);font-size:14px;color:var(--ink)}
.topic .mi{width:18px;height:18px;color:var(--pink)}
.topic .dd{width:18px;height:18px;color:var(--mute)}

main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}

/* строка языков */
.lb{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;border-bottom:1px solid var(--line)}
.lb button.l{flex:1;padding:14px 4px;font-weight:500;font-size:17px;text-transform:uppercase;letter-spacing:.3px}
.lb .sw{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.lb .sw:active{background:var(--card2)}
.card{background:var(--card);border-radius:22px;overflow:hidden}

/* текст */
#src{display:block;width:100%;min-height:150px;max-height:40vh;resize:none;border:0;outline:0;background:transparent;padding:14px 16px;font-size:24px;line-height:1.3}
#src::placeholder{color:var(--mute)}
.tools{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.tools .sp{flex:1}
.tools .ib{color:var(--mute)}
.mic.rec{color:#fff!important;background:var(--pink)!important;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,20,147,.55)}100%{box-shadow:0 0 0 16px rgba(255,20,147,0)}}
#res{margin-top:12px;padding:14px 16px 6px}
#res .t{font-size:24px;line-height:1.3;white-space:pre-wrap;word-break:break-word;min-height:30px}
#res .t.wait{color:var(--mute)}
#res .tools{padding:6px 0 0;margin-left:-8px}
.sec{display:flex;align-items:center;gap:6px;margin:20px 4px 10px;font-size:20px;font-weight:700}
.chips{display:flex;gap:10px;overflow-x:auto;padding:0 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.hc{flex:none;max-width:240px;background:var(--card);border-radius:14px;padding:10px 14px;text-align:left}
.hc div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hc div+div{color:var(--mute);font-size:14px;margin-top:2px}

/* фото */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 16px 20px}
.empty .big{width:120px;height:120px;border-radius:28px;background:linear-gradient(160deg,#ffd1e8,#ff6fb5);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:22px}
.empty .big .mi{width:64px;height:64px}
.empty h2{margin:0 0 8px;font-size:26px}
.empty p{margin:0 0 20px;color:var(--mute);line-height:1.4;max-width:360px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:25px;background:var(--pink);color:#fff;font-weight:500;font-size:16px}
.btn:active{background:var(--pinkd)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
#pstage{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#000}
#pcv{display:block;width:100%;height:auto}
.seg{display:flex;background:var(--card2);border-radius:20px;padding:4px;margin:12px auto 0;max-width:320px}
.seg button{flex:1;padding:9px;border-radius:16px;font-weight:500;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pl{margin-top:12px}
.pli{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:6px;align-items:flex-start}
.pli .x{flex:1;min-width:0}
.pli .o{color:var(--mute);font-size:14px;word-break:break-word}
.pli .d{font-size:17px;margin-top:2px;word-break:break-word}
.pli .ib{width:36px;height:36px;color:var(--mute)}
.busy{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);padding:20px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* сайты */
.urlrow{display:flex;gap:8px;width:100%;max-width:520px}
.urlrow input{flex:1;min-width:0;height:50px;border-radius:12px;border:0;outline:0;background:var(--card2);padding:0 14px;font-size:16px}
#wbar{position:sticky;top:-12px;margin:-12px -12px 10px;padding:8px 8px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;z-index:2}
#wbar .u{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wbar .seg{margin:0;max-width:none}
#wbar .seg button{padding:6px 10px;font-size:13px}
#wdoc h1{font-size:22px;margin:4px 0 12px}
#wdoc .w{margin:0 0 10px;line-height:1.45;font-size:16px;word-break:break-word}
#wdoc .w.h{font-size:19px;font-weight:700;margin-top:16px}
#wdoc .w.li{padding-left:14px;position:relative}
#wdoc .w.li:before{content:'';position:absolute;left:2px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--mute)}
#wdoc .w.lnk{color:#5aa9ff}
#wdoc .w.pend{color:var(--mute)}
#wdoc img{display:block;max-width:100%;height:auto;border-radius:10px;margin:6px 0 12px;background:var(--card2)}

/* избранное */
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;height:48px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px}
.search .mi{color:var(--mute)}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px;scrollbar-width:none}
.fchips button{flex:none;padding:9px 16px;border-radius:20px;color:var(--mute);font-size:15px}
.fchips button.on{background:var(--card2);color:var(--ink)}
.cnt{color:var(--mute);margin:8px 4px 12px}
.fi{background:var(--card);border-radius:18px;padding:12px 6px 12px 16px;margin-bottom:10px;display:flex;gap:4px}
.fi .x{flex:1;min-width:0}
.fi .p{color:var(--mute);font-size:14px;margin-bottom:6px}
.fi .s{font-weight:700;font-size:17px;word-break:break-word}
.fi .d{font-size:17px;margin-top:4px;word-break:break-word}
.fi .acts{display:flex;flex-direction:column}
.fi .ib{width:38px;height:38px;color:var(--mute)}

/* диалог */
#v-dlg{display:flex;flex-direction:column;padding:0}
.drow{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.drow .lbl{flex:1;font-size:16px}
.tg{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:.2s}
.tg:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--pink)}
.tg.on:after{left:25px}
.pane{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px}
.m{display:flex;flex-direction:column;margin-bottom:16px;max-width:88%}
.m .o{color:var(--mute);font-size:15px;margin:0 6px 6px;word-break:break-word}
.m .bw{display:flex;align-items:center;gap:6px}
.m .bb{padding:12px 16px;border-radius:16px;font-size:21px;line-height:1.3;word-break:break-word}
.m.A{align-self:flex-start}.m.A .bb{background:var(--a)}
.m.B{align-self:flex-end;align-items:flex-end}.m.B .bw{flex-direction:row-reverse}.m.B .bb{background:var(--b)}
.m .ib{width:38px;height:38px;color:var(--mute)}
.m.live .bb{opacity:.7;font-style:italic}
.clr{display:block;margin:6px auto 10px;padding:10px 20px;border-radius:20px;background:var(--card2);font-size:15px}
.mics{flex:none;display:flex;justify-content:space-around;padding:14px 10px calc(10px + env(safe-area-inset-bottom))}
.mc{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1}
.bigmic{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.bigmic .mi{width:38px;height:38px}
.bigmic.A{background:#1e5a47}.bigmic.B{background:#34437a}
.lpill{min-width:150px;padding:10px 18px;border:2px solid var(--ink);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px}
.lpill .mi{width:20px;height:20px}
.dhint{text-align:center;color:var(--mute);padding:40px 24px;line-height:1.5}
/* лицом к лицу */
#v-dlg.face .pane{border-top:1px solid var(--line)}
#v-dlg.face #paneB{transform:rotate(180deg);border-top:0;border-bottom:2px dashed var(--line)}
#v-dlg.face .mics{padding:8px}
#v-dlg.face .bigmic{width:64px;height:64px}
#v-dlg.face .mc{flex-direction:row;justify-content:center}
#v-dlg.face .lpill{min-width:120px}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;background:var(--card2);font-size:14px}
.fbtn .mi{width:18px;height:18px}
.fbtn.on{background:var(--pink);color:#fff}
#v-dlg.face .m .bb{font-size:22px}

/* нижнее меню */
#nav{flex:none;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;font-size:13px;color:var(--mute)}
#nav button .mi{width:26px;height:26px}
#nav button.on{color:var(--ink)}
#nav button.on .mi{color:var(--pink)}

/* выбор языка / темы */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
#sheet .in{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:10px 8px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
#sheet h3{margin:8px 14px 10px;font-size:18px}
#sheet .op{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:14px;text-align:left;font-size:17px}
#sheet .op small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
#sheet .op.on{background:var(--hl)}
#sheet .op .mi{color:var(--pink)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:30;max-width:88vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="offline" class="hidden"><svg class="mi" viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg>Нет интернета — перевод недоступен</div>
<header id="top">
  <button class="ib" id="btnBack" aria-label="Назад" style="visibility:hidden"><svg class="mi" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <h1 id="ttl"><b>ИТК</b> Переводчик</h1>
  <button class="topic" id="btnTopic" aria-label="Тема разговора"></button>
</header>
<main>
  <!-- ТЕКСТ -->
  <section class="view" id="v-text">
    <div class="card">
      <div class="lb" data-lb="main"></div>
      <textarea id="src" placeholder="Начните писать текст" rows="4"></textarea>
      <div class="tools">
        <button class="ib" id="tPaste" aria-label="Вставить"><svg class="mi" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg></button>
        <button class="ib hidden" id="tClear" aria-label="Очистить"><svg class="mi" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        <span class="sp"></span>
        <button class="ib" id="tCam" aria-label="Фото"><svg class="mi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
        <button class="ib mic" id="tMic" aria-label="Сказать"><svg class="mi" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
      </div>
    </div>
    <div class="card hidden" id="res">
      <div class="t" id="resT"></div>
      <div class="tools">
        <button class="ib" id="rSay" aria-label="Озвучить"><svg class="mi" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
        <button class="ib" id="rCopy" aria-label="Копировать"><svg class="mi" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>
        <span class="sp"></span>
        <button class="ib" id="rFav" aria-label="В избранное"></button>
      </div>
    </div>
    <div id="histBox" class="hidden">
      <div class="sec">История</div>
      <div class="chips" id="hist"></div>
    </div>
  </section>

  <!-- ФОТО -->
  <section class="view hidden" id="v-photo">
    <div class="card"><div class="lb" data-lb="ph"></div></div>
    <div id="pEmpty" class="empty">
      <div class="big"><svg class="mi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
      <h2>Перевод фото</h2>
      <p>Сфотографируйте вывеску, меню, этикетку или документ — перевод появится прямо на снимке</p>
      <div class="btns">
        <button class="btn" id="pShot"><svg class="mi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>Сфотографировать</button>
        <button class="btn ghost" id="pGal"><svg class="mi" viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4 2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>Выбрать из галереи</button>
      </div>
    </div>
    <div id="pRes" class="hidden">
      <div class="seg" id="pSeg"><button data-m="tr" class="on">Перевод</button><button data-m="or">Оригинал</button></div>
      <div id="pstage"><canvas id="pcv"></canvas></div>

  if (v) u.voice = v;
  else if (VOICES.length && lang !== 'ru') toast(lang === 'zh' ? 'В телефоне нет китайского голоса: Настройки → Синтез речи → установить китайский' : 'В телефоне нет английского голоса', 4500);

function photoLoad(file) {

  img.onload = function () {
    var max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    var w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);

      if (!j.blocks.length) { busy(false); $('pList').innerHTML = '<div class="dhint">Текст на фото не найден. Попробуйте снять ближе и ровнее.</div>'; return; }

      var ph = PH;

        return p.then(function () {

          return post('trb', { items: part.map(function (b) { return b.t; }), f: S.pf, to: S.pt, topic: S.topic }, 60000).then(function (r) {
            r.list.forEach(function (d, i) { part[i].d = d; });
            if (ph === PH) { drawPhoto(); paintPList(); }

    }).catch(function (e) { busy(false); toast(e.msg, 4000); });

  if (b && b.dataset.a === 'say') { say(x.d, x.to); return; }
  if (b && b.dataset.a === 'del') { FAV.splice(i, 1); ls('fav', FAV); favPaint(); toast('Удалено'); return; }
  S.f = x.f; S.to = x.to; saveS(); paintLB(); show('text'); $('src').value = x.s; srcChanged();
  lastRes = x; $('res').classList.remove('hidden'); $('resT').classList.remove('wait'); $('resT').textContent = x.d; paintFavBtn();
};

/* ---------- ДИАЛОГ ---------- */
var LIVE = null;  // {side, text}
function dlgPaint() {
  $('dAuto').classList.toggle('on', S.auto); $('dFace').classList.toggle('on', S.face);
  $('v-dlg').classList.toggle('face', S.face);
  $('paneB').classList.toggle('hidden', !S.face);
  $('mcB').classList.toggle('hidden', S.face);
  Array.prototype.forEach.call(document.querySelectorAll('.lpill'), function (b) {
    var side = b.dataset.pick; b.innerHTML = '<span>' + (side === 'B' ? L[S.B].own : L[S.A].n) + '</span>' + svg(IC.more);
  });
  dlgList();
}
function bubble(m, i, view) {
  // view: 'all' — обычный режим; 'A' / 'B' — половина экрана для одного собеседника (всё на его языке)
  var lang = m.side === 'A' ? S.A : S.B, other = m.side === 'A' ? S.B : S.A;
  var big, small, sayLang;
  if (view === 'all') { big = m.d; small = m.s; sayLang = other; }
  else if (view === m.side) { big = m.s; small = ''; sayLang = lang; }
  else { big = m.d; small = ''; sayLang = other; }
  if (m.live) { big = m.s || '…'; small = ''; }
  return '<div class="m ' + m.side + (m.live ? ' live' : '') + '">' + (small ? '<div class="o">' + esc(small) + '</div>' : '') +
    '<div class="bw"><div class="bb">' + esc(big == null ? '…' : big) + '</div>' + (m.live ? '' : '<button class="ib" data-i="' + i + '" data-l="' + sayLang + '" data-t="' + esc(big) + '" aria-label="Озвучить">' + svg(IC.say) + '</button>') + '</div></div>';
}
function dlgList() {
  var all = DLG.slice(); if (LIVE) all.push({ side: LIVE.side, s: LIVE.text, live: 1 });
  var hint = '<div class="dhint">Положите телефон между собой и собеседником. Нажмите свой микрофон и говорите — перевод появится и прозвучит на языке собеседника.</div>';
  var clr = DLG.length ? '<button class="clr" id="dClr">Очистить историю</button>' : '';
  if (!S.face) {
    $('msgsA').innerHTML = all.length ? all.map(function (m, i) { return bubble(m, i, 'all'); }).join('') + clr : hint;
  } else {
    $('msgsA').innerHTML = all.length ? all.map(function (m, i) { return bubble(m, i, 'A'); }).join('') + clr : hint;
    $('msgsB').innerHTML = all.map(function (m, i) { return bubble(m, i, 'B'); }).join('');
    $('msgsB').scrollTop = 1e9;
  }
  $('msgsA').scrollTop = 1e9;
}
$('v-dlg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'dClr') { DLG = []; ls('dlg', DLG); dlgList(); return; }
  if (b.id === 'dAuto') { S.auto = !S.auto; saveS(); dlgPaint(); return; }
  if (b.id === 'dFace') { S.face = !S.face; saveS(); dlgPaint(); toast(S.face ? 'Лицом к лицу: верх экрана — для собеседника' : 'Обычный режим'); return; }
  if (b.dataset.pick) {
    var side = b.dataset.pick;
    pickLang(side === 'A' ? 'Ваш язык' : 'Язык собеседника', S[side], function (id) {
      var o = side === 'A' ? 'B' : 'A'; if (S[o] === id) S[o] = S[side]; S[side] = id; saveS(); dlgPaint();
    });
    return;
  }
  if (b.dataset.side) {
    var sd = b.dataset.side, from = S[sd], to = sd === 'A' ? S.B : S.A;
    listen(from, b, function (p) { LIVE = { side: sd, text: p }; dlgList(); }, function (t) {
      LIVE = null; t = (t || '').trim();
      if (!t) { dlgList(); return; }
      var m = { side: sd, s: t, d: null, ts: Date.now() }; DLG.push(m); DLG = DLG.slice(-80); dlgList();
      translate(t, from, to).then(function (j) {
        m.d = j.t; ls('dlg', DLG); dlgList();
        if (S.auto) say(j.t, to);
      }, function (e) { m.d = '— ' + e.msg; dlgList(); });
    });
    return;
  }
  if (b.dataset.l && b.dataset.t) say(b.dataset.t, b.dataset.l);
});

/* ---------- запуск ---------- */
function onl() { $('offline').classList.toggle('hidden', navigator.onLine); }
window.addEventListener('online', onl); window.addEventListener('offline', onl); onl();
paintLB(); paintTopic(); paintHist(); srcChanged();
history.replaceState({ root: 1 }, ''); history.pushState({ v: 'text' }, '');
show('text', null, true);
// адрес сервера перевода можно поменять в cfg.json без переустановки приложения
fetch('cfg.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) { if (c && c.api) { API = c.api; ls('api', API); } }).catch(function () { var a = ls('api'); if (a) API = a; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
